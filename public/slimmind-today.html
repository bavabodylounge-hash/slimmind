<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b5452e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="오늘">
<title>오늘 · 슬림마인드</title>
<style>
:root{
  --paper:#f6f4ee; --card:#fffdf8; --card2:#fbf8f0;
  --ink:#1a1a17; --muted:#7c776b; --line:#d8d3c6;
  --vis:#b5452e; --vis-d:#8f321e; --vis-l:#f9ece8;
  --dark:#2a2118;
  --green:#5a6e3a; --green-l:#eef2e4;
  --amber:#c98a3c; --amber-l:#fbf2e3;
  --blue:#2d6a9f; --blue-l:#e8f0f9;
  --purple:#7c4dbc; --purple-l:#f0eafc;
  --icsz:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
  background:var(--paper); color:var(--ink);
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(30px + env(safe-area-inset-bottom));
}
.lic{display:inline-block;vertical-align:-.16em;flex-shrink:0;}

/* ── 상단 ── */
.hd{
  background:linear-gradient(165deg,#2a2118,#3a2e20); color:#f2ece0;
  padding:calc(22px + env(safe-area-inset-top)) 20px 22px;
  border-radius:0 0 22px 22px;
}
.hd-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;}
.hd-brand{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:900;letter-spacing:1.5px;color:#e8a87c;}
.hd-full{font-size:10.5px;font-weight:800;color:#a89880;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:5px 11px;cursor:pointer;font-family:inherit;}
.hd-full:active{background:rgba(255,255,255,.15);}
.hd-day{font-size:25px;font-weight:900;letter-spacing:-.8px;line-height:1.25;margin-bottom:5px;}
.hd-day .dow{color:#f0b48c;}
.hd-meta{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#c9bcab;flex-wrap:wrap;}
.hd-chip{background:rgba(240,180,140,.16);border:1px solid rgba(240,180,140,.3);
  border-radius:20px;padding:3px 10px;font-size:11px;color:#f0b48c;font-weight:800;}
/* 오행 배지 */
.hd-ohaeng{border-radius:20px;padding:3px 10px;font-size:11px;font-weight:800;}
.hd-ohaeng.목{background:rgba(90,110,58,.25);color:#9db86e;border:1px solid rgba(90,110,58,.4);}
.hd-ohaeng.화{background:rgba(181,69,46,.2);color:#f0a88c;border:1px solid rgba(181,69,46,.35);}
.hd-ohaeng.토{background:rgba(201,138,60,.2);color:#f0c878;border:1px solid rgba(201,138,60,.35);}
.hd-ohaeng.금{background:rgba(130,130,150,.2);color:#c8c8e0;border:1px solid rgba(130,130,150,.35);}
.hd-오haeng.수{background:rgba(45,106,159,.2);color:#8ab8e8;border:1px solid rgba(45,106,159,.35);}
/* redFlag 경고 배지 */
.hd-rf{background:rgba(220,50,50,.2);border:1px solid rgba(220,50,50,.4);
  border-radius:20px;padding:3px 10px;font-size:10px;color:#ff9090;font-weight:800;}

/* ── 진행 링 ── */
.prog{display:flex;align-items:center;gap:14px;margin-top:18px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:15px;padding:14px 16px;}
.prog-ring{position:relative;width:52px;height:52px;flex-shrink:0;}
.prog-ring svg{transform:rotate(-90deg);}
.prog-ring-tx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:900;color:#f2ece0;letter-spacing:-.5px;}
.prog-bd{flex:1;min-width:0;}
.prog-t{font-size:13.5px;font-weight:900;color:#f2ece0;margin-bottom:3px;letter-spacing:-.3px;}
.prog-s{font-size:11.5px;font-weight:600;color:#a89880;line-height:1.5;word-break:keep-all;}

/* ── 본문 ── */
.wrap{padding:0 16px;max-width:620px;margin:0 auto;}
.sec{display:flex;align-items:center;gap:9px;margin:26px 0 12px;}
.sec-n{width:21px;height:21px;border-radius:7px;background:var(--vis);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex-shrink:0;}
.sec-t{font-size:15px;font-weight:900;letter-spacing:-.4px;}
.sec-s{font-size:11.5px;font-weight:600;color:var(--muted);}
.sec-line{flex:1;height:1px;background:var(--line);}

/* ── 오늘 카드 ── */
.item{
  display:block;width:100%;text-align:left;font-family:inherit;cursor:pointer;
  background:var(--card);border:1.5px solid var(--line);border-left-width:6px;
  border-radius:16px;padding:16px 16px 14px;margin-bottom:11px;transition:all .16s;
}
.item:active{transform:scale(.99);}
.item.ex{border-left-color:var(--green);background:linear-gradient(160deg,#fff,#f3f7ea);border-color:#cdd9b0;}
.item.di{border-left-color:var(--amber);background:linear-gradient(160deg,#fff,#fbf2dd);border-color:#e8cd9a;}
.item.re{border-left-color:var(--vis);background:linear-gradient(160deg,#fff,#fdeee7);border-color:#f0c4b3;}
.item-hd{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
.item-ic{width:29px;height:29px;border-radius:9px;background:rgba(255,255,255,.85);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.item.ex .item-ic{color:var(--green);} .item.di .item-ic{color:var(--amber);} .item.re .item-ic{color:var(--vis);}
.item-k{flex:1;font-size:11.5px;font-weight:900;letter-spacing:.5px;opacity:.85;}
.item.ex .item-k{color:#3f5022;} .item.di .item-k{color:#8a5a18;} .item.re .item-k{color:#8f321e;}
.item-main{font-size:16px;font-weight:900;color:#241c14;line-height:1.45;letter-spacing:-.4px;
  word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
/* keyFocus 태그 */
.item-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;}
.item-tag{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;border:1px solid;opacity:.85;}
.item.ex .item-tag{color:#3f5022;border-color:#9cb36a;background:#eef2e4;}
.item.di .item-tag{color:#8a5a18;border-color:#e0b96a;background:#fdf6e8;}
.item.re .item-tag{color:#8f321e;border-color:#f0c4b3;background:#fdeee7;}
/* 영양/칼로리 배지 */
.item-nutr{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed rgba(0,0,0,.07);}
.nutr-b{font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px;background:#fff;border:1px solid #e8d9c6;color:#8a7252;}
/* 경고 노트 */
.item-warn{margin-top:8px;padding:7px 10px;border-radius:10px;background:rgba(220,50,50,.07);
  border:1px solid rgba(220,50,50,.2);font-size:11px;font-weight:700;color:#c03030;line-height:1.5;word-break:keep-all;}
/* 스트레스/수면 강조 */
.item-alert{margin-top:8px;padding:7px 10px;border-radius:10px;background:rgba(124,77,188,.07);
  border:1px solid rgba(124,77,188,.25);font-size:11px;font-weight:700;color:#7c4dbc;line-height:1.5;word-break:keep-all;}
.item-acts{display:flex;gap:8px;margin-top:13px;padding-top:12px;border-top:1px dashed rgba(0,0,0,.09);}
.btn{flex:1;border-radius:11px;padding:12px 8px;font-size:13px;font-weight:800;cursor:pointer;
  font-family:inherit;letter-spacing:-.3px;border:1.5px solid transparent;transition:transform .13s;
  display:flex;align-items:center;justify-content:center;gap:5px;}
.btn:active{transform:scale(.97);}
.btn.did{color:#fff;}
.item.ex .btn.did{background:var(--green);box-shadow:0 4px 12px rgba(90,110,58,.32);}
.item.di .btn.did{background:var(--amber);box-shadow:0 4px 12px rgba(201,138,60,.32);}
.item.re .btn.did{background:var(--vis);box-shadow:0 4px 12px rgba(181,69,46,.32);}
.btn.miss{background:#fff;color:#8a7f6e;border-color:#ded4c0;}
.btn.miss:active{background:#f7f3ea;}

/* 완료 상태 */
.item.done{opacity:.96;}
.item.done .item-acts{display:none;}
.item-note{display:none;align-items:center;gap:8px;margin-top:13px;padding-top:12px;
  border-top:1px dashed rgba(0,0,0,.09);font-size:12.5px;font-weight:800;}
.item.done .item-note,.item.missed .item-note{display:flex;}
.item.done .item-note{color:var(--green);}
.item.missed .item-note{color:#a3622a;}
.item.missed .item-acts{display:none;}
.item-note-x{margin-left:auto;font-size:11px;font-weight:800;color:var(--muted);
  background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:6px 11px;
  cursor:pointer;font-family:inherit;}

/* ── 못한 이유 ── */
.why{display:none;gap:7px;flex-wrap:wrap;margin-top:11px;padding-top:11px;border-top:1px dashed rgba(0,0,0,.09);}
.item.asking .why{display:flex;}
.item.asking .item-acts{display:none;}
.why-q{width:100%;font-size:13px;font-weight:900;color:#241c14;margin-bottom:3px;letter-spacing:-.3px;}
.why-o{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;
  font-size:12px;font-weight:700;color:#6a6252;cursor:pointer;font-family:inherit;transition:all .13s;}
.why-o:active{background:#f2ece0;transform:scale(.97);}

/* ── 주간 ── */
.week{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px 15px;}
.week-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;}
.week-t{font-size:13px;font-weight:900;letter-spacing:-.3px;}
.week-n{font-size:11.5px;font-weight:800;color:var(--muted);}
.week-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.wd{aspect-ratio:1;border-radius:10px;border:1.5px solid var(--line);background:var(--card2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.wd-d{font-size:10.5px;font-weight:800;color:var(--muted);}
.wd-c{font-size:12px;line-height:1;color:transparent;}
.wd.done{background:var(--green-l);border-color:#9cb36a;}
.wd.done .wd-d{color:#3f5022;} .wd.done .wd-c{color:var(--green);}
.wd.part{background:#fdf6e8;border-color:#e0b96a;}
.wd.part .wd-d{color:#8a5a18;} .wd.part .wd-c{color:var(--amber);}
.wd.today{border-color:var(--vis);border-width:2.5px;background:linear-gradient(165deg,#fff,#fdeee6);
  box-shadow:0 3px 10px rgba(181,69,46,.2);}
.wd.today .wd-d{color:var(--vis-d);font-weight:900;}

/* ── 스트릭 ── */
.streak{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:16px;margin-top:11px;}
.streak-n{font-size:29px;font-weight:900;color:var(--vis);letter-spacing:-1.5px;line-height:1;}
.streak-n small{font-size:13px;margin-left:2px;}
.streak-tx{flex:1;font-size:12.5px;font-weight:700;color:var(--muted);line-height:1.6;word-break:keep-all;}
.streak-tx b{color:var(--ink);}

/* ── 오늘의 전문 센터 ── */
.center-box{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:15px 15px;margin-bottom:0;}
.center-hd{display:flex;align-items:center;gap:8px;margin-bottom:11px;}
.center-ic{width:26px;height:26px;border-radius:8px;background:var(--vis-l);
  display:flex;align-items:center;justify-content:center;color:var(--vis);flex-shrink:0;}
.center-title{font-size:13px;font-weight:900;letter-spacing:-.3px;}
.center-sub{font-size:11px;font-weight:600;color:var(--muted);margin-top:1px;}
.center-list{display:flex;flex-direction:column;gap:8px;}
.center-item{display:flex;align-items:flex-start;gap:10px;
  background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;}
.center-item-ic{font-size:18px;flex-shrink:0;margin-top:1px;}
.center-item-bd{flex:1;min-width:0;}
.center-item-nm{font-size:13px;font-weight:900;color:var(--ink);letter-spacing:-.3px;margin-bottom:3px;}
.center-item-info{font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.55;word-break:keep-all;}
.center-item-tag{display:inline-block;margin-top:5px;font-size:10px;font-weight:800;
  padding:2px 8px;border-radius:8px;background:var(--vis-l);color:var(--vis-d);border:1px solid rgba(181,69,46,.2);}
.center-map-btn{width:100%;margin-top:10px;padding:11px;border-radius:12px;border:1.5px solid var(--line);
  background:#fff;font-size:12.5px;font-weight:800;color:var(--ink);cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:7px;transition:all .15s;}
.center-map-btn:active{background:#f2ece0;transform:scale(.98);}
.center-map-btn.loading{opacity:.6;pointer-events:none;}
.center-gps-hint{margin-top:7px;font-size:11px;font-weight:600;color:var(--muted);text-align:center;line-height:1.5;}

/* ── 11대 진단 우선순위 카드 ── */
.dx-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:0;}
.dx-rank-row{display:flex;flex-direction:column;gap:8px;}
.dx-rank-item{display:flex;align-items:flex-start;gap:10px;
  background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;
  position:relative;overflow:hidden;}
.dx-rank-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;}
.dx-rank-badge{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:900;color:#fff;flex-shrink:0;}
.dx-rank-bd{flex:1;min-width:0;}
.dx-rank-title{font-size:13px;font-weight:900;color:var(--ink);letter-spacing:-.3px;margin-bottom:2px;}
.dx-rank-expert{font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:5px;}
.dx-rank-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px;}
.dx-rank-tag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:7px;
  background:var(--vis-l);color:var(--vis-d);}
.dx-rank-urgency{font-size:10px;font-weight:700;color:var(--muted);}
.dx-urgency-bar{height:4px;border-radius:4px;background:var(--line);margin-top:5px;overflow:hidden;}
.dx-urgency-fill{height:100%;border-radius:4px;transition:width .5s ease;}
.dx-actions{margin-top:7px;display:flex;flex-direction:column;gap:4px;}
.dx-action-item{font-size:11px;font-weight:700;color:var(--ink);padding-left:10px;position:relative;}
.dx-action-item::before{content:'→';position:absolute;left:0;color:var(--vis);}
/* item-sub: item-main 바로 아래 보조 텍스트 (주차·kcal·BC코드 등) */
.item-sub{font-size:11px;font-weight:700;color:var(--muted);margin-top:5px;letter-spacing:-.2px;line-height:1.4;}
.item.ex .item-sub{color:#5a6e3a;}
.item.di .item-sub{color:#a07030;}
.item.re .item-sub{color:#9b4530;}
/* P6 딥링크 버튼 */
.dx-link-btn{flex:1.3;padding:10px 8px;border-radius:11px;border:none;
  background:var(--vis);color:#fff;font-size:11.5px;font-weight:800;
  cursor:pointer;font-family:inherit;text-align:center;transition:all .15s;}
.dx-link-btn:active{opacity:.87;transform:scale(.98);}
.dx-cta-row{margin-top:10px;display:flex;gap:7px;}
.dx-cta-btn{flex:1;padding:10px 8px;border-radius:11px;border:1.5px solid var(--line);
  background:#fff;font-size:11.5px;font-weight:800;color:var(--ink);cursor:pointer;
  font-family:inherit;text-align:center;transition:all .15s;}
.dx-cta-btn:active{background:#f2ece0;transform:scale(.98);}
.dx-cta-btn.primary{background:var(--vis);color:#fff;border-color:var(--vis);}

/* ── 컨설턴트 ── */
.con{background:linear-gradient(165deg,#2a2118,#3a2e20);color:#f2ece0;border-radius:16px;
  padding:18px 16px;margin-top:11px;}
.con-hd{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
.con-av{width:33px;height:33px;border-radius:50%;background:rgba(240,180,140,.2);
  border:1px solid rgba(240,180,140,.35);display:flex;align-items:center;justify-content:center;
  color:#f0b48c;flex-shrink:0;}
.con-nm{font-size:13px;font-weight:900;}
.con-r{font-size:10.5px;font-weight:700;color:#a89880;}
.con-tx{font-size:12.5px;line-height:1.75;color:#c9bcab;word-break:keep-all;}

/* ── 홈 화면 안내 ── */
.tip{background:var(--vis-l);border:1px solid rgba(181,69,46,.2);border-radius:14px;
  padding:15px;margin-top:26px;display:flex;gap:11px;}
.tip-ic{color:var(--vis);flex-shrink:0;}
.tip-bd{flex:1;}
.tip-t{font-size:12.5px;font-weight:900;color:var(--vis-d);margin-bottom:4px;}
.tip-x{font-size:11.5px;line-height:1.65;color:#8a5a4a;word-break:keep-all;}

/* ── 토스트 ── */
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px);background:var(--dark);color:#f2ece0;border-radius:13px;
  padding:13px 17px;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);
  box-shadow:0 10px 30px rgba(0,0,0,.28);opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;z-index:200;}
.toast.on{opacity:1;transform:translate(-50%,0);}
.toast-ic{color:#9db87a;flex-shrink:0;}
.toast-tx{font-size:12.5px;font-weight:800;line-height:1.45;}
.toast-sub{display:block;font-size:11px;font-weight:600;opacity:.72;margin-top:2px;}

.foot{text-align:center;font-size:10.5px;color:#a9a396;line-height:1.7;margin-top:30px;padding:0 20px;}
</style>
</head>
<body>

<div class="hd">
  <div class="hd-top">
    <div class="hd-brand">SLIMMIND · DAILY</div>
    <button class="hd-full" onclick="openFull()">전체 결과지</button>
  </div>
  <div class="hd-day" id="hd-day">오늘 · <span class="dow">월요일</span></div>
  <div class="hd-meta">
    <span class="hd-chip" id="hd-week">회복기 1주차</span>
    <span id="hd-name">지현 님</span>
    <span id="hd-ohaeng-badge"></span>
    <span id="hd-rf-badges"></span>
  </div>
  <div class="prog">
    <div class="prog-ring">
      <svg width="52" height="52" viewBox="0 0 52 52">
        <circle cx="26" cy="26" r="22" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="5"/>
        <circle id="ring-fl" cx="26" cy="26" r="22" fill="none" stroke="#f0b48c" stroke-width="5"
                stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="138.2"
                style="transition:stroke-dashoffset .6s cubic-bezier(.22,1,.36,1)"/>
      </svg>
      <div class="prog-ring-tx" id="ring-tx">0/3</div>
    </div>
    <div class="prog-bd">
      <div class="prog-t" id="prog-t">오늘 할 일 세 가지</div>
      <div class="prog-s" id="prog-s">하나만 체크해도 오늘은 성공이에요.</div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="sec">
    <span class="sec-n">1</span>
    <span class="sec-t">오늘 할 일</span>
    <span class="sec-line"></span>
  </div>
  <div id="items"></div>

  <div class="sec">
    <span class="sec-n">2</span>
    <span class="sec-t">이번 주</span>
    <span class="sec-line"></span>
  </div>
  <div class="week">
    <div class="week-hd">
      <span class="week-t">출석</span>
      <span class="week-n" id="week-n">0일 체크</span>
    </div>
    <div class="week-row" id="week-row"></div>
  </div>

  <div class="streak">
    <div class="streak-n" id="streak-n">0<small>일</small></div>

/* ── 진단 ID ── */
function sid(){
  try {
    var q = new URLSearchParams(location.search);
    return q.get('id') || q.get('diagnosis_id') || q.get('did') || 'local';
  } catch(e){ return 'local'; }
}
function ckKey(){ return 'slimmind_checks_' + sid(); }

  try { CHECKS = JSON.parse(localStorage.getItem(ckKey())) || {}; }

}

  try { localStorage.setItem(ckKey(), JSON.stringify(CHECKS)); } catch(e){}
}
function cellId(wk, area, di){ return 'wg' + wk + area + di; }

/* ── 결과 데이터 로드 ── */
function loadData(){
  try {
    if (window.__RESULT_DATA__) return window.__RESULT_DATA__;
    var q = new URLSearchParams(location.search).get('data');
    if (q) return JSON.parse(decodeURIComponent(q));
    var keys = ['slimmind_result','surveyResult','survey_result','resultData','sm_result'];
    for (var i=0;i<keys.length;i++){
      var raw = localStorage.getItem(keys[i]);
      if (!raw) continue;
      var p = JSON.parse(raw);
      if (p && (p.axisScores || p.answers)) return p;
    }
  } catch(e){}
  return null;
}

/* ── 개인화 메타 로드 (slimmind_meta_) ── */

  } catch(e){}
  return null;
}

/* ── 주차 데이터 로드 ── */
function loadWeeks(){
  try {
    if (window.__ACTIVE_WEEKS__ && window.__ACTIVE_WEEKS__.length) return window.__ACTIVE_WEEKS__;
    var raw = localStorage.getItem('slimmind_weeks_' + sid());
    if (raw){ var w = JSON.parse(raw); if (w && w.length) return w; }
  } catch(e){}
  return null;
}

/* ── 현재 주차 ── */
function startKey(){ return 'slimmind_start_' + sid(); }
function curWeek(total){
  var t = total || 12;
  try {
    var st = localStorage.getItem(startKey());
    if (!st){ st = String(Date.now()); localStorage.setItem(startKey(), st); }
    var days = Math.floor((Date.now() - parseInt(st,10)) / 86400000);
    return Math.min(t, Math.max(1, Math.floor(days/7) + 1));
  } catch(e){ return 1; }
}

/* ── 문구 정리 ── */
function trim(s, n){
  s = String(s||'').split('—')[0].replace(/\([^)]*\)/g,'').replace(/\[[^\]]*\]/g,'').replace(/\s+/g,' ').trim();
  n = n || 30;
  return s.length > n ? s.slice(0, n-1).trim() + '…' : s;
}

             ? META.axisScores
             : (d.axisScores || d.axis_scores || {});

  var jsd = new Date().getDay();

  var weeks = loadWeeks();

  renderHead();

/* ── 오늘 할 일 세 줄 (완전 개인화) ── */
/* ══════════════════════════════════════════════════════════════
   todayTasks() — 완전 동적 처방
   우선순위:
     ① W(주차 데이터) 존재 → 운동/식단/회복 텍스트 + 요일별 분기
     ② nutrition: W.nutrition → META 기반 today 재계산
     ③ axisScores: 경고/alert 동적 주입
     ④ W=null fallback: BC계열+오행+redFlags 기반 최소 처방
   ══════════════════════════════════════════════════════════════ */
function todayTasks(){
  // ── 공통 헬퍼: axisScore 정규화 (hospital 0~10 / v4 0~100 → 모두 0~10) ──
  var axN = function(k){
    var v = Number(AXIS_SCORES[k] || AXIS_SCORES[k.toLowerCase()] || 0);
    return v > 10 ? v / 10 : v;
  };
  var _a01 = axN('A01'), _a02 = axN('A02'), _a04 = axN('A04'),
      _a05 = axN('A05'), _a06 = axN('A06'), _a09 = axN('A09'), _a10 = axN('A10');

  // ── BC 계열 분류 ──
  var _bc       = (BC_CODE || '').toUpperCase();
  var _bcIsCirc = /^BC-(1|2|10)$/.test(_bc);
  var _bcIsMus  = /^BC-(4|7|8|11)$/.test(_bc);
  var _bcIsHorm = /^BC-(3|5|6|9|12|13|14|15|16)$/.test(_bc);

  // ── nutrition 계산: W.nutrition 우선, 없으면 META 기반 재계산 ──
  var nutr = _calcNutritionForToday();

  // ── W=null: BC+오행+redFlags 기반 동적 처방 생성 ──
  if (!W){
    return _buildFallbackTasks(_a01, _a05, _a06, nutr);
  }

  // ── 운동: 요일별 분기 (exercise_detail "월·수·금 — xxx / 화·목·토 — yyy") ──
  var ex = W.exercise_ok || '오늘의 운동';
  if (W.exercise_detail){
    var parts = String(W.exercise_detail).split('/');
    for (var pi = 0; pi < parts.length; pi++){
      if (parts[pi].indexOf(DAYS[TODAY]) >= 0){
        ex = parts[pi].replace(/^[^—\-]*[—\-]\s*/, '').trim();
        break;
      }
    }
  }
  // axisScores 기반 운동 조정
  if (_a05 >= 7) ex = ex.replace(/(HIIT|고강도 인터벌|인터벌)/gi, '저강도 유산소·호흡');

  // ── 운동 경고/alert ──
  var exWarn = '', exAlert = '';
  if (_a05 >= 7)   exAlert = '⚡ 코르티솔↑ — 오늘 HIIT 금지. 4·7·8 호흡 10분으로 대체';
  else if (_bcIsCirc && _a09 >= 7) exAlert = '💧 순환↓ — 저강도 + 하지 거상 스트레칭 우선';
  else if (_bcIsMus && _a04 >= 7) exAlert = '💪 근감소↑ — 오늘 저항운동 필수. 공복 고강도 금지';
  if (W.exercise_ban) exWarn = '🚫 ' + trim(W.exercise_ban, 55);

  // ── 식단 경고/alert ──
  var diWarn = '', diAlert = '';
  if (_a01 >= 7)                          diAlert = '🩸 인슐린↑ — 식후 15분 워킹 의무 · 정제당 완전 차단';
  else if (RED_FLAGS.indexOf('DIABETES') >= 0) diAlert = '🩸 당뇨 주의 — 저GI 식품 우선 · 식후 혈당 측정';
  if (RED_FLAGS.indexOf('FATTY_LIVER') >= 0)   diWarn  = '⚠ 지방간 — 액상과당·가공 주스 오늘 금지';
  else if (RED_FLAGS.indexOf('YOYO') >= 0)     diWarn  = '⚠ 요요 이력 — 극단 결식 금지 · 단백질 우선';
  if (W.diet_ban && !diWarn) diWarn = '🚫 ' + trim(W.diet_ban, 55);

  // ── 회복 경고/alert ──
  var reWarn = '', reAlert = '';
  if (_a06 >= 7)        reAlert = '😴 수면질↓ — 스마트폰 취침 90분 전 차단 · 22시 취침 필수';
  else if (_a05 >= 7)   reAlert = '🧘 스트레스↑ — 취침 전 마그네슘 + 4·7·8 호흡 10분';
  if (RED_FLAGS.indexOf('HTN') >= 0 && !reWarn) reWarn = '⚠ 혈압 관리 — 운동 전 준비운동 10분 필수';

  // ── keyFocus 태그 (W에서 최대 3개) ──
  var kFocus = Array.isArray(W.keyFocus) ? W.keyFocus.slice(0, 3) : [];

  // ── 식단 텍스트: diet_ok + 오행 보정 문구 ──
  var dietTx = W.diet_ok || '오늘의 균형 식단';
  if (W.ohaeng_caution) dietTx = dietTx + ' · ' + trim(W.ohaeng_caution, 25);

  return [
    { k:'ex', nm:'운동',
      tx:   trim(ex, 45),
      sub:  W.phase ? W.phase + ' · ' + WK + '주차' : WK + '주차',
      tags: kFocus.slice(0, 2),
      nutr: null,
      warn: exWarn, alert: exAlert },
    { k:'di', nm:'식단',
      tx:   trim(dietTx, 45),
      sub:  nutr ? nutr.kcal + ' kcal · 단백 ' + nutr.proteinG + 'g' : '',
      tags: kFocus.slice(0, 1),
      nutr: nutr ? [
        nutr.kcal + ' kcal',
        '단백질 ' + nutr.proteinG + 'g',
        '탄수 '   + nutr.carbG    + 'g',
        '지방 '   + nutr.fatG     + 'g',
      ] : [],
      warn: diWarn, alert: diAlert },
    { k:'re', nm:'회복',
      tx:   trim(W.recovery_ok || '오늘 밤 회복 루틴', 45),
      sub:  W.diet_macro_note ? trim(W.diet_macro_note, 30) : '',
      tags: kFocus.slice(2, 3),
      nutr: null,

}

/* ── nutrition 재계산: W.nutrition 우선, META 신체스펙 기반 fallback ──
   hospital.html의 computeNutrition 로직을 경량 버전으로 재현
   BC_MACRO + redFlags 보정 + 주차별 kcal 배율 적용 */
function _calcNutritionForToday(){
  // 1순위: W에 nutrition이 이미 있으면 그대로 사용
  if (W && W.nutrition && W.nutrition.kcal) return W.nutrition;

  // 2순위: META 신체스펙 기반 재계산
  if (!META) return null;
  var cw  = META.curWeight  || 65;
  var gw  = META.goalWeight || Math.round(cw * 0.9);
  var h   = META.height     || 162;
  var ag  = META.age        || 35;
  var bc  = (META.bcCode || BC_CODE || 'BC-6').toUpperCase();
  var rfl = RED_FLAGS || [];

  if (cw <= 0 || gw <= 0) return null;

  // BMR (Mifflin-St Jeor 여성 기준)
  var bmr  = Math.round(10 * cw + 6.25 * h - 5 * ag - 161);
  // 활동계수: A04(근감소) 축 기반
  var a04v = Number((AXIS_SCORES['A04'] || AXIS_SCORES['a04'] || 0));
  if (a04v > 10) a04v = a04v / 10;
  var actF = a04v >= 7 ? 1.375 : a04v >= 4 ? 1.44 : 1.55;
  var tdee = Math.round(bmr * actF);

  // 결손 칼로리 (12주 기준)
  var lossKg  = Math.max(0, cw - gw);
  var deficit = Math.round(lossKg * 7700 / 84);
  var MIN_KCAL = 1200;
  if (tdee - deficit < MIN_KCAL) deficit = Math.max(0, tdee - MIN_KCAL);
  var baseKcal = Math.max(MIN_KCAL, tdee - deficit);

  // BC별 탄단지 기준 비율
  var BC_MACRO = {
    'BC-1':[38,32,30],'BC-2':[40,30,30],'BC-3':[33,33,34],'BC-4':[38,32,30],
    'BC-5':[40,30,30],'BC-6':[38,32,30],'BC-7':[40,30,30],'BC-8':[42,30,28],
    'BC-9':[35,35,30],'BC-10':[38,30,32],'BC-11':[40,32,28],'BC-12':[35,33,32],
    'BC-13':[35,32,33],'BC-14':[38,32,30],'BC-15':[33,35,32],'BC-16':[35,33,32],
  };
  var m = BC_MACRO[bc] || [38, 32, 30];
  var cP = m[0], pP = m[1], fP = m[2];

  // redFlags 보정
  if (rfl.indexOf('DIABETES')    >= 0){ cP = Math.max(25, cP-5); pP = Math.min(40, pP+3); fP = 100-cP-pP; }
  if (rfl.indexOf('YOYO')        >= 0){ deficit = Math.round(deficit*0.75); baseKcal = Math.max(MIN_KCAL, tdee-deficit); pP = Math.min(40, pP+3); cP = Math.max(30, cP-2); fP = 100-cP-pP; }
  if (rfl.indexOf('PCOS')        >= 0){ cP = Math.max(28, cP-5); pP = Math.min(38, pP+2); fP = 100-cP-pP; }
  if (rfl.indexOf('FATTY_LIVER') >= 0){ cP = Math.max(30, cP-3); fP = Math.min(38, fP+3); pP = 100-cP-fP; }
  if (rfl.indexOf('STEROID')     >= 0){ pP = Math.min(42, pP+5); fP = Math.max(20, fP-5); cP = 100-pP-fP; }

  // 주차별 kcal 배율 (computeNutrition weekVariants와 동일 로직)
  var wkMul = 1.0;
  if      (WK === 1)  wkMul = (rfl.indexOf('YOYO')>=0) ? 1.0 : 0.90;  // 회복기 진입
  else if (WK === 3)  wkMul = 1.0;
  else if (WK === 4)  { wkMul = 1.0; cP = Math.max(23, cP-10); pP = Math.min(42, pP+5); fP = 100-cP-pP; }
  else if (WK === 5)  { wkMul = 0.95; cP = Math.max(23, cP-5);  pP = Math.min(45, pP+2); fP = 100-cP-pP; }
  else if (WK === 6)  { wkMul = 0.93; cP = Math.max(23, cP-6);  pP = Math.min(45, pP+3); fP = 100-cP-pP; }
  else if (WK === 7)  { wkMul = 0.91; cP = Math.max(23, cP-7);  pP = Math.min(45, pP+3); fP = 100-cP-pP; }
  else if (WK === 8)  { wkMul = 0.90; cP = Math.max(23, cP-7);  pP = Math.min(45, pP+3); fP = 100-cP-pP; }
  else if (WK === 9)  { wkMul = 0.89; cP = Math.max(23, cP-8);  pP = Math.min(45, pP+3); fP = 100-cP-pP; }
  else if (WK === 10) { wkMul = 1.0;  baseKcal = Math.round(baseKcal*0.93 + (Math.round(10*gw+6.25*h-5*ag-161)*1.44)*0.07); }
  else if (WK === 11) { wkMul = 1.0;  baseKcal = Math.round(baseKcal*0.7  + (Math.round(10*gw+6.25*h-5*ag-161)*1.44)*0.3);  }
  else if (WK === 12) { wkMul = 1.0;  baseKcal = Math.round((10*gw+6.25*h-5*ag-161)*1.44); }

  var kcal     = Math.max(MIN_KCAL, Math.round(baseKcal * wkMul));
  var carbG    = Math.round(kcal * (cP/100) / 4);
  var proteinG = Math.round(kcal * (pP/100) / 4);
  var fatG     = Math.round(kcal * (fP/100) / 9);

  return { kcal: kcal, carbG: carbG, proteinG: proteinG, fatG: fatG,
           note: WK + '주차 · ' + bc + ' · 목표 ' + gw + 'kg 기반 계산' };
}

/* ── 카드 렌더 ── */
function renderItems(){
  var host = document.getElementById('items');
  host.innerHTML = todayTasks().map(function(t){
    var id = cellId(WK, t.k, TODAY);
    var rec = CHECKS[id];
    var cls = rec ? (rec.s === 'miss' ? ' missed' : ' done') : '';
    var noteTx = rec ? (rec.s === 'miss'
        ? '못했어요' + (rec.r ? ' · ' + rec.r : '')
        : '완료 · 컨설턴트에게 전송됨') : '';

    var tagsHtml = t.tags.length > 0
      ? '<div class="item-tags">' + t.tags.map(function(tg){ return '<span class="item-tag">' + tg + '</span>'; }).join('') + '</div>'
      : '';
    var nutrHtml = t.nutr && t.nutr.length > 0
      ? '<div class="item-nutr">' + t.nutr.map(function(n){ return '<span class="nutr-b">' + n + '</span>'; }).join('') + '</div>'
      : '';
    var warnHtml = t.warn  ? '<div class="item-warn">'  + t.warn  + '</div>' : '';
    var alertHtml= t.alert ? '<div class="item-alert">' + t.alert + '</div>' : '';

    return '<div class="item ' + t.k + cls + '" id="it-' + t.k + '" data-k="' + t.k + '">' +
      '<div class="item-hd">' +
        '<span class="item-ic">' + IC[t.k] + '</span>' +
        '<span class="item-k">' + t.nm + '</span>' +
      '</div>' +
      '<div class="item-main">' + t.tx + '</div>' +
      (t.sub ? '<div class="item-sub">' + t.sub + '</div>' : '') +
      tagsHtml + nutrHtml + warnHtml + alertHtml +
      '<div class="item-acts">' +
        '<button class="btn did" onclick="mark(\'' + t.k + '\',\'did\')">' + IC.chk + ' 했어요</button>' +
        '<button class="btn miss" onclick="ask(\'' + t.k + '\')">못했어요</button>' +
      '</div>' +
      '<div class="why">' +
        '<div class="why-q">어떤 이유였나요?</div>' +
        MISS.map(function(r){
          return '<button class="why-o" onclick="mark(\'' + t.k + '\',\'miss\',\'' + r + '\')">' + r + '</button>';
        }).join('') +
      '</div>' +
      '<div class="item-note">' + IC.chk + '<span>' + noteTx + '</span>' +
        '<button class="item-note-x" onclick="undo(\'' + t.k + '\')">수정</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function ask(k){
  document.querySelectorAll('.item').forEach(function(el){ el.classList.remove('asking'); });
  document.getElementById('it-' + k).classList.add('asking');
}

function mark(k, state, reason){
  var id = cellId(WK, k, TODAY);
  CHECKS[id] = { s:state, r:reason||'', w:'', e:(CHECKS[id]&&CHECKS[id].e)||0, t:Date.now() };
  saveChecks();
  renderItems(); renderWeek(); renderProg();
  var nm = (k==='ex'?'운동':k==='di'?'식단':'회복');
  var who = (CON ? CON + ' 컨설턴트' : '담당 컨설턴트');
  if (state === 'did'){
    toast('<b>' + DAYS[TODAY] + '요일 ' + nm + ' 완료</b> 전송됨', who + '님에게 전달됐어요');
  } else {
    toast('<b>' + DAYS[TODAY] + '요일 ' + nm + ' 못함</b> 전송됨', who + '님에게 전달됐어요 · ' + reason);
  }
}

function undo(k){
  var id = cellId(WK, k, TODAY);
  var e = (CHECKS[id] && CHECKS[id].e) || 0;
  if (e >= 2){ toast('<b>수정 횟수를 다 썼어요</b>', '기록은 2번까지 고칠 수 있어요'); return; }
  CHECKS[id] = { s:'', r:'', w:'', e:e+1, t:Date.now() };
  saveChecks();
  renderItems(); renderWeek(); renderProg();
  toast('<b>수정할 수 있어요</b>', '다시 선택하면 덮어씁니다 · 앞으로 ' + (1-e) + '번 더');
}

/* ── 이번 주 출석 ── */
function dayState(di){
  var n = 0;
  ['ex','di','re'].forEach(function(k){
    var r = CHECKS[cellId(WK,k,di)];
    if (r && r.s === 'did') n++;
  });
  return n;
}
function renderWeek(){
  var row = document.getElementById('week-row'), h = '', full = 0;
  for (var i=0;i<7;i++){
    var n = dayState(i);
    var cls = n>=3 ? 'done' : (n>0 ? 'part' : '');
    if (i === TODAY) cls += ' today';
    if (n > 0) full++;
    h += '<div class="wd ' + cls + '"><span class="wd-d">' + DAYS[i] + '</span>' +
         '<span class="wd-c">' + (n>0 ? IC.chk : '') + '</span></div>';
  }
  row.innerHTML = h;
  document.getElementById('week-n').textContent = full + '일 체크';
  var s = streak();
  document.getElementById('streak-n').innerHTML = s + '<small>일</small>';
  document.getElementById('streak-tx').innerHTML = s > 0
    ? '<b>' + s + '일 연속</b>으로 이어가고 있어요. 오늘도 하나만 체크하면 계속됩니다.'
    : '오늘 하나만 체크하면 <b>연속 기록이 시작</b>돼요.';
}
function streak(){
  var n = 0;
  for (var i=TODAY;i>=0;i--){ if (dayState(i) > 0) n++; else break; }
  return n;
}

/* ── 진행 링 ── */
function renderProg(){
  var n = dayState(TODAY), pct = n/3;
  var C = 2 * Math.PI * 22;
  document.getElementById('ring-fl').setAttribute('stroke-dashoffset', String(C * (1-pct)));
  document.getElementById('ring-tx').textContent = n + '/3';
  var t = document.getElementById('prog-t'), s = document.getElementById('prog-s');
  if (n === 0){ t.textContent = '오늘 할 일 세 가지'; s.textContent = '하나만 체크해도 오늘은 성공이에요.'; }
  else if (n < 3){ t.textContent = n + '개 체크했어요'; s.textContent = '남은 것도 편하게, 무리하지 마세요.'; }
  else { t.textContent = '오늘 다 하셨어요'; s.textContent = NAME + ' 님, 오늘 정말 잘하셨습니다.'; }
}

/* BC_CODE + axisScores + redFlags + dxTop3 기반 동적 코멘트 생성 */
function _genConComment(){
  var lines = [];
  // axisScores 스케일 정규화 (hospital: 0~10 그대로, v4: 0~100 → /10)
  var _axVal = function(k){
    var v = AXIS_SCORES[k];
    if (v == null) return 0;
    return v > 10 ? v / 10 : v;
  };
  var _a01 = _axVal('A01'), _a05 = _axVal('A05'), _a06 = _axVal('A06');
  var hasDIAB  = RED_FLAGS.indexOf('DIABETES') >= 0;
  var hasYOYO  = RED_FLAGS.indexOf('YOYO') >= 0;
  var hasHTN   = RED_FLAGS.indexOf('HTN') >= 0;
  var dxTop3   = (META && Array.isArray(META.dxTop3)) ? META.dxTop3 : [];
  var topDx    = dxTop3[0] ? dxTop3[0].key : '';

  // ① 이번 주차 기반 인사
  var phaseMsg = {
    '회복기':'회복기엔 몸이 먼저입니다. 강도보다 규칙성이 핵심이에요.',
    '전환기':'전환기 — 식단과 운동이 맞물리는 시점입니다. 탄수화물 타이밍 집중해요.',
    '가속기':'가속기에 접어들었어요. 지금 조금 더 조이면 결과가 달라집니다.',
    '안정기':'안정기 — 감량 유지가 목표입니다. 근육을 지키며 식이를 정착시켜요.',
  };
  lines.push(phaseMsg[PHASE] || WK + '주차 잘 이어가고 있어요. 꾸준함이 이 단계의 핵심입니다.');

  // ② redFlags 우선 경고
  if (hasDIAB)  lines.push('⚠ 당뇨 위험 지표가 있어요. 오늘도 저GI 식품과 식후 워킹 꼭 지켜주세요.');
  else if (hasHTN) lines.push('⚠ 혈압 관리 중이에요. 고강도 운동 전 준비운동 충분히 해주세요.');
  else if (hasYOYO) lines.push('요요 이력이 있으니 — 결과보다 루틴 정착이 먼저입니다. 체중은 나중에 따라와요.');

  // ③ axisScores 기반 오늘 핵심 경고
  if (_a05 >= 7)      lines.push('스트레스 지수가 높게 나타났어요. 오늘은 HIIT보다 걷기·호흡으로 대체하세요.');
  else if (_a06 >= 7) lines.push('수면 질이 낮아요. 오늘 22시 이전 취침, 스마트폰 90분 전 차단 — 이게 오늘 최고의 처방입니다.');
  else if (_a01 >= 7) lines.push('혈당 패턴이 불안정해요. 식후 15분 이내 걷기를 오늘 꼭 실천해주세요.');

  // ④ 1순위 진단 기반 전문 코멘트
  var dxMsg = {
    '식단':   '식이 패턴이 지금 가장 시급해요. 탄수화물 타이밍과 단백질 목표량 — 이 두 가지만 잡아도 달라집니다.',
    '심리':   '스트레스·감정 식욕이 체중 관리의 첫 번째 장벽입니다. 오늘 식욕 트리거를 적어보세요.',
    '호르몬': '호르몬 변동이 감지돼요. 수면과 식이 타이밍이 호르몬 안정의 핵심입니다.',
    '운동':   'BC 기질에 맞지 않는 운동이 오히려 역효과를 냅니다. 오늘 처방된 운동 종류를 지켜주세요.',
    '수면':   '수면이 모든 처방의 기반입니다. 오늘 밤 회복 루틴을 최우선으로 지켜주세요.',
    '순환':   '순환 개선이 이번 주 핵심입니다. 수분 섭취와 하지 거상 스트레칭 챙겨주세요.',
    '체형':   '체형 교정이 우선입니다. 자세 의식과 코어 활성화를 오늘 운동에 집중해주세요.',
    '한방':   '한방 접근이 지금 도움이 될 시점이에요. 한의원 상담을 고려해보세요.',
  };
  if (topDx && dxMsg[topDx]) lines.push(dxMsg[topDx]);

  // ⑤ BC코드 기반 한 줄 맞춤
  var bcMsg = {
    'BC-1':'하지 부종이 오늘 컨디션에 영향줄 수 있어요. 수분과 낮은 강도 유지하세요.',
    'BC-3':'혈당 스파이크가 오늘의 적입니다. 정제당 차단이 최우선이에요.',
    'BC-5':'호르몬 흐름을 거스르지 마세요. 무리하지 않는 것이 오늘의 전략입니다.',
    'BC-6':'근육 회복이 감량의 엔진이에요. 단백질 타이밍 잊지 마세요.',
    'BC-7':'근육량이 당신의 자산입니다. 오늘 저항운동 빠트리지 마세요.',
  };
  var bc = BC_CODE.toUpperCase();
  if (bcMsg[bc]) lines.push(bcMsg[bc]);

  if (lines.length === 0) return '';
  // 최대 3줄, HTML 줄바꿈
  return lines.slice(0,3).join('<br><br>');
}

/* ══════════════════════════════════════════════════════
   전문 센터 추천 — 백엔드 /api/places + 카카오 REST API 연동
   BC 코드 + 이번 주 center 필드 → 카테고리 결정
   GPS 있을 때 → 실제 주변 센터 검색
   GPS 없을 때 → 카테고리 가이드 + 전화번호 없이 안내
   ══════════════════════════════════════════════════════ */
/* ── 11대 진단 우선순위 렌더 (dxTop3) ── */
var DX_KEY_ICON = {
  '식단':'🥗','심리':'🧠','호르몬':'⚗️','운동':'💪','수면':'🌙','순환':'💧',
  '체형':'🦴','한방':'🌿','시술':'✨','약물':'💊','철학':'🕊️'
};
var DX_KEY_CENTER = {
  '식단':'식단','심리':'심리','호르몬':'호르몬','운동':'운동','수면':'회복',
  '순환':'순환','체형':'체형','한방':'한방','시술':'시술','약물':'약물','철학':'철학'
};
function renderDxPriority(){
  var dxTop3 = (META && Array.isArray(META.dxTop3) && META.dxTop3.length > 0) ? META.dxTop3 : null;
  if (!dxTop3) {
    document.getElementById('sec-dx').style.display = 'none';
    return;
  }

  document.getElementById('sec-dx').style.display = '';
  document.getElementById('sec-dx-sub').textContent = 'BC 분석 기반 · 지금 가장 시급한 진단';

  // ── P6 딥링크 URL 생성 (openFull과 동일 로직) ──
  var _id = sid();
  var _params = new URLSearchParams(window.location.search);
  var _isHospital = _params.get('src') === 'hospital' || !!_params.get('hid');
  var _resultFile = _isHospital ? 'result-hospital.html' : 'slimmind-result.html';
  var _resultBase = location.href.replace(/[^\/]*$/, '') + _resultFile;
  // 결과지 기본 URL (id 파라미터 포함)
  var _resultUrl = (_id && _id !== 'local')
    ? (_resultBase + '?id=' + encodeURIComponent(_id))
    : _resultBase;
  // P6 섹션(맞춤 영양·비율 페이지) 앵커 딥링크
  // hospital.html → #p6-section / result-v4 → #p6-ratio
  var _p6Anchor = _isHospital ? '#p6-section' : '#p6-ratio';
  var _p6Url = _resultUrl + (_resultUrl.indexOf('?') >= 0
    ? '&ref=today_dx' : '?ref=today_dx') + _p6Anchor;

  var rankColors = ['#e8513a','#e06c30','#d88a3c'];
  var html = '<div class="dx-box"><div class="dx-rank-row">';

  dxTop3.forEach(function(dx, i){
    var icon      = DX_KEY_ICON[dx.key] || '📋';
    var color     = dx.color || rankColors[i] || '#888';
    var urgPct    = Math.max(8, Math.round((dx.urgency / 10) * 100));
    var tags      = Array.isArray(dx.tags)    ? dx.tags.slice(0,3)    : [];
    var acts      = Array.isArray(dx.actions) ? dx.actions.slice(0,2) : [];
    var centerKey = DX_KEY_CENTER[dx.key] || dx.key;

    // 1순위 카드에만 "처방 전체 보기" primary 딥링크 버튼 노출
    // 나머지는 센터 찾기 버튼 단독
    var ctaHtml = '<div class="dx-cta-row">';
    if (i === 0){
      // 1순위: 처방 전체 보기(P6) + 센터 찾기
      ctaHtml +=
        '<button class="dx-link-btn" onclick="_goP6(\'' + encodeURIComponent(_p6Url) + '\')">' +
          '전체 처방 보기 →</button>' +
        '<button class="dx-cta-btn" onclick="searchCenterByDx(\'' + centerKey + '\')" style="margin-left:0;">' +
          IC.map + ' ' + dx.key + ' 센터</button>';
    } else {
      // 2·3순위: 센터 찾기만
      ctaHtml +=
        '<button class="dx-cta-btn" onclick="searchCenterByDx(\'' + centerKey + '\')">' +
          IC.map + ' 주변 ' + dx.key + ' 센터 찾기</button>';
    }
    ctaHtml += '</div>';

    html +=
      '<div class="dx-rank-item" style="border-left:3px solid ' + color + ';">' +
        '<div class="dx-rank-badge" style="background:' + color + ';">' + (i+1) + '</div>' +
        '<div class="dx-rank-bd">' +
          '<div class="dx-rank-title">' + icon + ' ' + (dx.title || dx.key) + '</div>' +
          '<div class="dx-rank-expert">' + (dx.expert || '') + '</div>' +
          (tags.length > 0
            ? '<div class="dx-rank-tags">' +
                tags.map(function(t){
                  return '<span class="dx-rank-tag" style="background:' + color + '18;color:' + color + ';">' + t + '</span>';
                }).join('') +
              '</div>'
            : '') +
          '<div class="dx-urgency-bar">' +
            '<div class="dx-urgency-fill" style="width:' + urgPct + '%;background:' + color + ';"></div>' +
          '</div>' +
          '<div class="dx-rank-urgency">긴급도 ' + dx.urgency + '/10</div>' +
          (acts.length > 0
            ? '<div class="dx-actions">' +
                acts.map(function(a){ return '<div class="dx-action-item">' + a + '</div>'; }).join('') +
              '</div>'
            : '') +
          ctaHtml +
        '</div>' +
      '</div>';
  });

  html += '</div></div>';
  document.getElementById('dx-area').innerHTML = html;
}

/* P6 딥링크 이동 (인코딩된 URL 복원 후 이동) */
function _goP6(encodedUrl){
  try { location.href = decodeURIComponent(encodedUrl); }
  catch(e){ location.href = encodedUrl; }
}

/* dxTop3 항목 클릭 시 해당 카테고리로 센터 검색 */
function searchCenterByDx(cat){
  // cat은 DX_KEY_CENTER 변환값 (한글 카테고리)
  // DX_TO_CENTER에도 없을 경우 그대로 사용
  var resolvedCat = DX_KEY_CENTER[cat] || (DX_TO_CENTER[cat] ? DX_TO_CENTER[cat].cat : cat);
  _currentCenterCats = [resolvedCat];
  var secEl = document.getElementById('sec-center');
  var subEl = document.getElementById('sec-center-sub');
  secEl.style.display = '';
  // 서브타이틀: "진단명 기반 · 전문 센터"
  var _dxTop3 = (META && Array.isArray(META.dxTop3)) ? META.dxTop3 : [];
  var _dxMatch = _dxTop3.filter(function(dx){
    return DX_KEY_CENTER[dx.key] === resolvedCat || dx.key === cat;
  })[0];
  subEl.textContent = (_dxMatch && _dxMatch.title)
    ? (_dxMatch.title + ' · 주변 전문 센터')
    : (resolvedCat + ' 전문 센터');
  document.getElementById('center-area').innerHTML = _buildCenterStaticHTML([resolvedCat]);
  searchNearbyCenters();
  // 화면 스크롤
  setTimeout(function(){ secEl.scrollIntoView({ behavior:'smooth', block:'start' }); }, 200);
}

/* 현재 추천 카테고리 저장 (GPS 버튼 클릭 시 재사용) */
var _currentCenterCats = [];

/* ── renderCenters: 우선순위
     ① dxTop3[0].key → DX_TO_CENTER 매핑  (가장 시급한 진단 기반)
     ② W.center 필드 (컨설턴트 직접 지정)
     ③ BC_CENTER_MAP[BC_CODE]             (BC기질 기본값)
     → 최대 2개 카테고리, 중복 제거 후 사용 ── */
function renderCenters(){
  var _dxTop3  = (META && Array.isArray(META.dxTop3)) ? META.dxTop3 : [];
  var _bcKey   = (BC_CODE || '').toUpperCase();

  // ① dxTop3 기반: 상위 2개 dx.key를 DX_TO_CENTER로 변환
  var dxCats = [];
  for (var di = 0; di < Math.min(2, _dxTop3.length); di++){
    var dxK = _dxTop3[di].key || '';
    // DX_KEY_CENTER(단어→카테고리) 또는 DX_TO_CENTER(영어ID→객체)로 변환
    var mapped = DX_KEY_CENTER[dxK]
              || (DX_TO_CENTER[dxK] ? DX_TO_CENTER[dxK].cat : null)
              || null;
    if (mapped && dxCats.indexOf(mapped) < 0) dxCats.push(mapped);
  }

  // ② W.center 필드 파싱 (ex: "순환+체형센터" or "식단 센터")
  var wCats = [];
  if (W && W.center){
    wCats = W.center.replace(/\s/g,'').split('+')
      .map(function(c){ return c.replace('센터','').trim(); })
      .filter(function(c){ return c.length > 0; });
  }

  // ③ BC_CENTER_MAP 기본값
  var bcCats = _bcKey ? (BC_CENTER_MAP[_bcKey] || ['식단','운동']) : ['식단','운동'];

  // 우선순위 병합: dxCats > wCats > bcCats, 최대 2개 중복 없이
  var merged = [];
  var _addCat = function(arr){
    arr.forEach(function(c){
      if (merged.length < 2 && merged.indexOf(c) < 0) merged.push(c);
    });
  };
  _addCat(dxCats);
  _addCat(wCats);
  _addCat(bcCats);

  _currentCenterCats = merged.length > 0 ? merged : ['식단','운동'];

  var secEl = document.getElementById('sec-center');
  var subEl = document.getElementById('sec-center-sub');
  secEl.style.display = '';

  // subEl: 출처에 따라 다른 텍스트
  if (dxCats.length > 0){
    subEl.textContent = '진단 우선순위 기반 · ' + WK + '주차 센터';
  } else if (wCats.length > 0){
    subEl.textContent = WK + '주차 컨설턴트 처방 센터';
  } else {
    subEl.textContent = _bcKey + ' 기질 · ' + WK + '주차 핵심 센터';
  }

  var areaEl = document.getElementById('center-area');
  areaEl.innerHTML = _buildCenterStaticHTML(_currentCenterCats);
  _fetchCentersWithGPS(_currentCenterCats);
}

    html += '<div class="center-item">' +
      '<div class="center-item-ic">' + info.icon + '</div>' +
      '<div class="center-item-bd">' +
        '<div class="center-item-nm">' + info.label + '</div>' +
        '<div class="center-item-info">' + info.desc + '</div>' +
        '<span class="center-item-tag">' + WK + '주차 우선 센터</span>' +
      '</div></div>';
  });
  html += '</div>';
  html += '<button class="center-map-btn" id="center-map-btn" onclick="searchNearbyCenters()">' +
    IC.map + ' 내 주변 ' + cats.slice(0,2).join('·') + ' 센터 찾기' +
    '</button>' +
    '<div class="center-gps-hint" id="center-gps-hint">위치 권한을 허용하면 실시간 주변 센터를 보여드립니다</div>' +
    '</div>';
  return html;
}

/* GPS + /api/places 호출 */
function _fetchCentersWithGPS(cats){
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat = pos.coords.latitude, lng = pos.coords.longitude;
    _loadPlacesFromAPI(cats, lat, lng);
  }, function(){ /* GPS 거부 시 정적 카드만 표시 */ }, { timeout:5000, maximumAge:60000 });
}

function searchNearbyCenters(){
  var btn = document.getElementById('center-map-btn');
  var hint = document.getElementById('center-gps-hint');
  if (btn) { btn.classList.add('loading'); btn.textContent = '위치 확인 중...'; }
  if (hint) hint.textContent = '현재 위치를 가져오는 중입니다...';

  if (!navigator.geolocation){
    if (hint) hint.textContent = '이 브라우저는 위치 기능을 지원하지 않습니다.';
    if (btn) btn.classList.remove('loading');
    return;
  }
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat = pos.coords.latitude, lng = pos.coords.longitude;
    _loadPlacesFromAPI(_currentCenterCats, lat, lng, true);
  }, function(err){
    if (btn) { btn.classList.remove('loading'); btn.innerHTML = IC.map + ' 위치 권한을 허용해주세요'; }
    if (hint) hint.textContent = '브라우저 설정에서 위치 권한을 허용하면 주변 센터를 찾을 수 있습니다.';
  }, { timeout:8000, maximumAge:30000 });
}

function _loadPlacesFromAPI(cats, lat, lng, showToast){
  var type = CENTER_TYPE_MAP[cats[0]] || cats[0];
  var apiUrl = '/api/places?type=' + encodeURIComponent(type) +
    '&lat=' + lat + '&lng=' + lng + '&radius=3000&limit=4';

  fetch(apiUrl)
    .then(function(r){ return r.json(); })
    .then(function(data){
      var btn = document.getElementById('center-map-btn');
      var hint = document.getElementById('center-gps-hint');
      if (btn) btn.classList.remove('loading');

      if (data.ok && data.results && data.results.length > 0){
        _renderPlaceResults(data.results, cats, lat, lng);
        if (hint) hint.textContent = '현재 위치 기준 ' + data.results.length + '개 센터를 찾았습니다';
        if (showToast) toast('<b>주변 ' + type + ' 센터 ' + data.results.length + '곳</b> 발견', '지도로 확인하세요');
      } else {
        if (hint) hint.textContent = '주변 ' + type + ' 센터를 찾지 못했습니다. 반경을 넓혀보세요.';
        if (btn) btn.innerHTML = IC.map + ' 다시 검색';
      }
    })
    .catch(function(){
      var btn = document.getElementById('center-map-btn');
      if (btn) { btn.classList.remove('loading'); btn.innerHTML = IC.map + ' 다시 검색'; }
    });
}

function _renderPlaceResults(places, cats, userLat, userLng){
  var listEl = document.getElementById('center-list');
  if (!listEl) return;

  var html = '';
  places.forEach(function(p){
    var dist = p.distance ? Math.round(p.distance) + 'm' : '';
    var nameStr = p.name || '';
    var addrStr = p.address ? p.address.replace(/^(서울특별시|서울시|경기도|부산광역시)/,'').trim() : '';
    var phoneStr = p.phone || '';
    var urlStr   = p.url   || '';
    var featured = p.is_featured ? ' · <b>제휴</b>' : '';
    var tagStr   = (cats[0] || '') + ' 센터';

    html += '<div class="center-item">' +
      '<div class="center-item-ic">' + (p.icon || '📍') + '</div>' +
      '<div class="center-item-bd">' +
        '<div class="center-item-nm">' + nameStr + (dist ? ' <span style="font-size:10px;font-weight:600;color:var(--muted);margin-left:4px;">' + dist + '</span>' : '') + '</div>' +
        '<div class="center-item-info">' +
          (addrStr ? addrStr : '') +
          (phoneStr ? (addrStr ? '<br>' : '') + phoneStr : '') +
          (featured ? featured : '') +
        '</div>' +
        '<span class="center-item-tag">' + tagStr + '</span>' +
        (urlStr ? ' <a href="' + urlStr + '" target="_blank" style="font-size:10px;font-weight:800;color:var(--blue);text-decoration:none;margin-left:6px;">지도보기 →</a>' : '') +
      '</div></div>';
  });

  listEl.innerHTML = html;

  // 지도 버튼 업데이트
  var btn = document.getElementById('center-map-btn');
  if (btn){
    var firstPlace = places[0];
    if (firstPlace && firstPlace.url){
      btn.onclick = function(){ window.open(firstPlace.url, '_blank'); };
      btn.innerHTML = IC.map + ' ' + firstPlace.name + ' 카카오맵에서 보기';
    } else if (firstPlace && firstPlace.lat && firstPlace.lng){
      var kakaoMapUrl = 'https://map.kakao.com/link/map/' + encodeURIComponent(firstPlace.name) + ',' + firstPlace.lat + ',' + firstPlace.lng;
      btn.onclick = function(){ window.open(kakaoMapUrl, '_blank'); };
      btn.innerHTML = IC.map + ' 카카오맵에서 전체 보기';
    } else {
      btn.innerHTML = IC.map + ' 재검색';
      btn.onclick = searchNearbyCenters;
    }
  }
}

/* ── 전체 결과지 이동 ── */
function openFull(){
  var id = sid();
  var params = new URLSearchParams(window.location.search);
  var isHospital = params.get('src') === 'hospital' || !!params.get('hid');
  var resultFile = isHospital ? 'result-hospital.html' : 'slimmind-result.html';
  var base = location.href.replace(/[^\/]*$/, '') + resultFile;
  location.href = (id && id !== 'local') ? (base + '?id=' + encodeURIComponent(id)) : base;
}

/* ── 홈 화면 안내 ── */
function detectPlatform(){
  var el = document.getElementById('tip-x');
  if (el) el.innerHTML = '<b>카카오톡 나에게 보내기</b>나 즐겨찾기에 저장해 두세요. 다음에도 이 주소로 들어오시면 기록이 그대로 이어집니다.';
}

/* ── 토스트 ── */
function toast(msg, sub){
  var t = document.getElementById('toast');
  document.getElementById('toast-ic').innerHTML = IC.sent;
  document.getElementById('toast-tx').innerHTML = msg + (sub ? '<span class="toast-sub">' + sub + '</span>' : '');
  t.classList.remove('on'); void t.offsetWidth; t.classList.add('on');
  clearTimeout(window.__tT__);
  window.__tT__ = setTimeout(function(){ t.classList.remove('on'); }, 3000);
}

/* 날짜가 바뀌면 새로 그린다 */
setInterval(function(){
  var jsd = new Date().getDay();
  var t = (jsd === 0) ? 6 : jsd - 1;
  if (t !== TODAY){ TODAY = t; renderHead(); renderItems(); renderWeek(); renderProg(); }
}, 60000);

boot();
