<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SlimMind B2B 파트너 대시보드</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand: #6366f1;
      --brand-light: #6366f122;
      --primary: #1A3C6B;
      --accent: #10B981;
      --danger: #EF4444;
      --warn: #F59E0B;
      --bg: #F1F5F9;
      --card: #fff;
      --text: #1E293B;
      --muted: #64748B;
      --border: #E2E8F0;
    }
    body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── 로그인 ─── */
    #login-page { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px; }
    .login-card { background: var(--card); border-radius: 20px; padding: 48px 40px; width: 100%; max-width: 420px; box-shadow: 0 4px 32px rgba(0,0,0,.10); }
    .login-brand { text-align: center; margin-bottom: 32px; }
    .login-brand-badge { display: inline-block; background: var(--brand); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-bottom: 8px; letter-spacing: .05em; }
    .login-logo-text { font-size: 28px; font-weight: 700; color: var(--primary); }
    .login-logo-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .login-field { margin-bottom: 16px; }
    .login-field label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .login-field input { width: 100%; border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 16px; font-size: 15px; font-family: inherit; outline: none; transition: border-color .2s; }
    .login-field input:focus { border-color: var(--brand); }
    .login-btn { width: 100%; background: var(--brand); color: #fff; border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 8px; transition: opacity .2s; }
    .login-btn:hover { opacity: .85; }
    .login-err { color: var(--danger); font-size: 13px; text-align: center; margin-top: 8px; display: none; }
    .login-hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 16px; line-height: 1.6; }

    /* ── 레이아웃 ─── */
    #main-page { display: none; }
    .layout { display: flex; min-height: 100vh; }

    /* ── 사이드바 ─── */
    .sidebar { width: 240px; background: var(--brand); color: #fff; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100vh; z-index: 100; }
    .sidebar-logo { padding: 24px 20px 20px; border-bottom: 1px solid rgba(255,255,255,.15); }
    .sidebar-logo-text { font-size: 18px; font-weight: 700; }
    .sidebar-logo-sub { font-size: 11px; opacity: .6; margin-top: 2px; }
    .sidebar-brand-name { font-size: 12px; opacity: .8; margin-top: 6px; background: rgba(255,255,255,.15); padding: 4px 8px; border-radius: 6px; display: inline-block; }
    .sidebar-nav { flex: 1; padding: 12px 0; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; cursor: pointer; font-size: 14px; font-weight: 500; transition: background .15s; border-left: 3px solid transparent; }
    .nav-item:hover { background: rgba(255,255,255,.1); }
    .nav-item.active { background: rgba(255,255,255,.18); border-left-color: #fff; }
    .nav-item i { width: 18px; text-align: center; opacity: .8; }
    .sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,.15); }
    .sidebar-user { font-size: 13px; opacity: .7; margin-bottom: 8px; }
    .logout-btn { font-size: 13px; color: rgba(255,255,255,.6); cursor: pointer; }
    .logout-btn:hover { color: #fff; }

    /* ── 메인 ─── */
    .main-content { margin-left: 240px; flex: 1; min-height: 100vh; }
    .topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 32px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
    .topbar-title { font-size: 16px; font-weight: 700; }
    .page-body { padding: 28px 32px; }

    /* ── 카드 ─── */
    .card { background: var(--card); border-radius: 14px; border: 1px solid var(--border); padding: 24px; margin-bottom: 20px; }
    .card-title { font-size: 15px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

    /* ── KPI ─── */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .kpi-card { background: var(--card); border-radius: 14px; border: 1px solid var(--border); padding: 20px; }
    .kpi-val { font-size: 32px; font-weight: 700; color: var(--brand); line-height: 1; }
    .kpi-label { font-size: 13px; color: var(--muted); margin-top: 6px; }

    /* ── 테이블 ─── */
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #F8FAFC; padding: 10px 14px; text-align: left; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 12px 14px; border-bottom: 1px solid #F1F5F9; vertical-align: middle; }
    tr:hover td { background: #F8FAFC; }

    /* ── 배지 ─── */
    .badge { display: inline-block; border-radius: 6px; padding: 3px 10px; font-size: 11px; font-weight: 600; }
    .badge-purple { background: #EDE9FE; color: #7C3AED; }
    .badge-green { background: #DCFCE7; color: #16A34A; }
    .badge-blue { background: #DBEAFE; color: #2563EB; }
    .badge-gray { background: #F1F5F9; color: #64748B; }

    /* ── 버튼 ─── */
    .btn { border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: opacity .15s; }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-ghost { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
    .btn-sm { padding: 5px 12px; font-size: 12px; }

    /* ── 필터 ─── */
    .filter-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-row input, .filter-row select { border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 13px; font-family: inherit; outline: none; background: var(--card); }
    .filter-row input:focus, .filter-row select:focus { border-color: var(--brand); }

    /* ── 결과 카드 ─── */
    .result-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 16px; cursor: pointer; transition: box-shadow .15s, border-color .15s; }
    .result-card:hover { box-shadow: 0 4px 16px rgba(99,102,241,.12); border-color: var(--brand); }
    .result-icon { width: 48px; height: 48px; border-radius: 12px; background: var(--brand-light); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .result-info { flex: 1; }
    .result-name { font-size: 15px; font-weight: 700; }
    .result-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .result-nick { font-size: 13px; font-weight: 600; color: var(--brand); margin-top: 4px; }

    /* ── QR 섹션 ─── */
    .qr-section { text-align: center; padding: 24px; }
    .qr-url { font-size: 13px; color: var(--brand); word-break: break-all; margin: 12px 0; background: var(--brand-light); padding: 10px 16px; border-radius: 8px; }

    /* ── 파트너 뷰 카드 ─── */
    .partner-view-card { border: 1.5px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .partner-view-card.rec1 { border-left: 4px solid #10B981; }
    .partner-view-card.rec2 { border-left: 4px solid #3B82F6; }
    .partner-view-card.forbid { border-left: 4px solid #EF4444; }
    .pv-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
    .pv-text { font-size: 14px; color: var(--text); line-height: 1.6; }

    /* ── 빈 상태 ─── */
    .empty-state { text-align: center; padding: 48px; color: var(--muted); }
    .empty-state i { font-size: 36px; margin-bottom: 12px; opacity: .4; }
    .empty-state p { font-size: 14px; }

    /* ── 토스트 ─── */
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast { background: #1E293B; color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; box-shadow: 0 4px 12px rgba(0,0,0,.2); animation: slideIn .3s ease; max-width: 320px; }
    .toast.success { background: #10B981; }
    .toast.error { background: #EF4444; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* ── 브랜드 배너 ─── */
    .brand-banner { border-radius: 14px; padding: 20px 24px; margin-bottom: 24px; display: flex; align-items: center; gap: 16px; color: #fff; }
    .brand-logo-img { width: 56px; height: 56px; object-fit: contain; border-radius: 10px; background: rgba(255,255,255,.2); padding: 4px; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main-content { margin-left: 0; }
      .kpi-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<div class="toast-container" id="toast-container"></div>

<!-- 로그인 페이지 -->
<div id="login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-brand-badge">B2B PARTNER</div>
      <div class="login-logo-text">SlimMind</div>
      <div class="login-logo-sub">B2B 파트너 대시보드</div>
    </div>
    <div class="login-field">
      <label>파트너 코드</label>
      <input type="text" id="login-code" placeholder="B2B-AES-001" autocomplete="off"
        onkeydown="if(event.key==='Enter') doLogin()">
    </div>
    <div class="login-field">
      <label>비밀번호</label>
      <input type="password" id="login-pw" placeholder="초기 비밀번호"
        onkeydown="if(event.key==='Enter') doLogin()">
    </div>
    <button class="login-btn" onclick="doLogin()"><i class="fas fa-sign-in-alt"></i> 로그인</button>
    <div class="login-err" id="login-err"></div>
    <div class="login-hint">
      코드와 초기 비밀번호는 관리자에게 문의하세요<br>
      마스터 관리자: <a href="/admin" style="color:var(--brand)">관리자 페이지</a>
    </div>
  </div>
</div>

<!-- 메인 페이지 -->
<div id="main-page">
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div style="display:flex;align-items:center;gap:10px">
          <div id="sidebar-logo-img-wrap" style="display:none">
            <img id="sidebar-logo-img" src="" style="height:32px;object-fit:contain;border-radius:6px;background:rgba(255,255,255,.15);padding:2px">
          </div>
          <div>
            <div class="sidebar-logo-text" id="sidebar-brand-text">SlimMind</div>
            <div class="sidebar-logo-sub">B2B 파트너</div>
          </div>
        </div>
        <div class="sidebar-brand-name" id="sidebar-brand-name-badge"></div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-item active" data-page="dashboard"><i class="fas fa-chart-pie"></i> 대시보드</div>
        <div class="nav-item" data-page="customers"><i class="fas fa-users"></i> 고객 결과 조회</div>
        <div class="nav-item" data-page="qr"><i class="fas fa-qrcode"></i> QR 코드 출력</div>
        <div class="nav-item" data-page="partner-view"><i class="fas fa-star"></i> 파트너 추천 뷰</div>
        <div class="nav-item" data-page="profile"><i class="fas fa-building"></i> 업체 정보</div>
        <div class="nav-item" data-page="guide"><i class="fas fa-book-open"></i> 이용 안내</div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user" id="sidebar-user"></div>
        <a href="https://pf.kakao.com/_xgCgsX/chat" target="_blank"
           style="display:flex;align-items:center;gap:8px;background:#FEE500;color:#3C1E1E;border-radius:8px;padding:9px 12px;font-size:12px;font-weight:700;text-decoration:none;margin-bottom:10px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#3C1E1E"><path d="M12 2C6.48 2 2 5.92 2 10.73c0 2.98 1.67 5.6 4.19 7.22l-.97 3.57 4.1-2.72c.87.16 1.76.24 2.68.24 5.52 0 10-3.92 10-8.77S17.52 2 12 2z"/></svg>
          본사 쳄팅 문의
        </a>
        <div class="logout-btn" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> 로그아웃</div>
      </div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <div class="topbar-title" id="topbar-title">대시보드</div>
        <div style="display:flex;align-items:center;gap:12px">
          <span id="topbar-user" style="font-size:13px;color:var(--muted)"></span>
        </div>
      </div>
      <div class="page-body" id="page-body">
        <div style="padding:40px;text-align:center;color:var(--muted)"><i class="fas fa-circle-notch fa-spin fa-2x"></i></div>
      </div>
    </main>
  </div>
</div>

<script>
// ─── 전역 상태 ────────────────────────────────
// 마스터 대리접속: sm_b2b_token이 있으면 우선 사용
const _impB2BToken = localStorage.getItem('sm_b2b_token');
if (_impB2BToken && new URLSearchParams(location.search).get('_impersonate') === '1') {
  localStorage.setItem('b2b_token', _impB2BToken);
}
let TOKEN = localStorage.getItem('b2b_token') || '';
let USER_CODE = localStorage.getItem('b2b_code') || '';
let USER_INFO = null;
let BRAND = {};
let currentPage = 'dashboard';

// ─── API 헬퍼 ────────────────────────────────
async function api(method, path, body) {
  try {
    const opts = {
      method,
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
    };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch('/api' + path, opts);
    const data = await res.json();
    if (res.status === 401) { doLogout(); return null; }
    return data;
  } catch (e) {
    toast('네트워크 오류', 'error');
    return null;
  }
}

// ─── 토스트 ──────────────────────────────────
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ─── 날짜 포맷 ───────────────────────────────
function fmtDate(s) {
  if (!s) return '-';
  return new Date(s).toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

// ─── 로그인 ──────────────────────────────────
async function doLogin() {
  const code = document.getElementById('login-code').value.trim().toUpperCase();
  const pw = document.getElementById('login-pw').value;
  const errEl = document.getElementById('login-err');
  errEl.style.display = 'none';

  if (!code || !pw) { errEl.textContent = '코드와 비밀번호를 입력하세요.'; errEl.style.display = 'block'; return; }
  if (!code.startsWith('B2B-')) { errEl.textContent = 'B2B 파트너 코드는 B2B-로 시작합니다.'; errEl.style.display = 'block'; return; }

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, password: pw })
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || '로그인 실패'; errEl.style.display = 'block'; return; }
    if (data.role !== 'B2B_PARTNER') { errEl.textContent = 'B2B 파트너 계정으로만 접근 가능합니다.'; errEl.style.display = 'block'; return; }

    TOKEN = data.token;
    USER_CODE = data.code;
    BRAND = {
      brand_name: data.brand_name,
      brand_color: data.brand_color || '#6366f1',
      brand_logo_url: data.brand_logo_url || '',
    };
    localStorage.setItem('b2b_token', TOKEN);
    localStorage.setItem('b2b_code', USER_CODE);
    localStorage.setItem('b2b_brand', JSON.stringify(BRAND));

    initMain(data.name, data.code);
  } catch (e) {
    errEl.textContent = '서버 오류가 발생했습니다.'; errEl.style.display = 'block';
  }
}

function doLogout() {
  TOKEN = ''; USER_CODE = '';
  localStorage.removeItem('b2b_token');
  localStorage.removeItem('b2b_code');
  localStorage.removeItem('b2b_brand');
  document.getElementById('login-page').style.display = 'flex';
  document.getElementById('main-page').style.display = 'none';
}

function initMain(name, code) {
  // 브랜드 컬러 적용
  const color = BRAND.brand_color || '#6366f1';
  document.documentElement.style.setProperty('--brand', color);
  document.documentElement.style.setProperty('--brand-light', color + '22');

  // 사이드바 브랜드
  document.getElementById('sidebar-brand-text').textContent = BRAND.brand_name || 'SlimMind';
  document.getElementById('sidebar-brand-name-badge').textContent = code;
  if (BRAND.brand_logo_url) {
    document.getElementById('sidebar-logo-img').src = BRAND.brand_logo_url;
    document.getElementById('sidebar-logo-img-wrap').style.display = 'block';
  }
  document.getElementById('sidebar-user').textContent = name;
  document.getElementById('topbar-user').textContent = name;

  document.getElementById('login-page').style.display = 'none';
  document.getElementById('main-page').style.display = 'block';
  navigateTo('dashboard');
}

// ─── 내비게이션 ──────────────────────────────
document.querySelectorAll('.nav-item').forEach(el => {
  el.onclick = () => navigateTo(el.dataset.page);
});

function navigateTo(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  const titles = {
    dashboard: '대시보드',
    customers: '고객 결과 조회',
    qr: 'QR 코드 출력',
    'partner-view': '파트너 추천 뷰',
    profile: '업체 정보',
    guide: '이용 안내',
  };
  document.getElementById('topbar-title').textContent = titles[page] || page;
  const body = document.getElementById('page-body');
  body.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted)"><i class="fas fa-circle-notch fa-spin fa-2x"></i></div>';

  if (page === 'dashboard') loadDashboard();
  else if (page === 'customers') loadCustomers();
  else if (page === 'qr') loadQR();
  else if (page === 'partner-view') loadPartnerView();
  else if (page === 'profile') loadProfile();
  else if (page === 'guide') loadGuideB2B();
}

function loadGuideB2B() {
  const origin = location.origin;
  document.getElementById('page-body').innerHTML = `
    <div class="card" style="max-width:760px;margin:0 auto">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
        <div style="width:40px;height:40px;background:rgba(255,255,255,.15);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px">🏢</div>
        <div>
          <div style="font-size:17px;font-weight:700">B2B 파트너 이용 가이드</div>
          <div style="font-size:12px;opacity:.7">슬림마인드 B2B 파트너를 위한 상세 이용법</div>
        </div>
      </div>

      <div style="border-left:4px solid rgba(255,255,255,.5);padding:14px 18px;background:rgba(255,255,255,.08);border-radius:0 10px 10px 0;margin-bottom:14px">
        <div style="font-size:11px;font-weight:700;opacity:.7;margin-bottom:5px">STEP 1</div>
        <div style="font-size:14px;font-weight:700;margin-bottom:6px">📱 고객 설문 링크 &amp; QR 활용</div>
        <div style="font-size:13px;opacity:.9;line-height:1.8">대시보드의 <b>파트너 전용 설문 링크</b>를 고객에게 카카오톡/문자로 발송하세요.<br>링크: <code style="background:rgba(0,0,0,.2);padding:1px 6px;border-radius:4px">${origin}/s/B2B-XXX-001</code><br>QR 코드 메뉴에서 QR을 인송하여 원내 안내판·리플릿 등에 활용하세요.</div>
      </div>

function copyLink() {
  const url = `${location.origin}/s/${USER_CODE}`;

function printQR(qrUrl, surveyUrl) {

      body { font-family: sans-serif; text-align: center; padding: 40px; }
      h2 { color: ${color}; margin-bottom: 8px; }

    <body>
      <h2>${brandName}</h2>
      <p>QR 코드를 스캔하여 무료 체형 분석을 시작하세요</p>

      <br><button onclick="window.print()">🖨️ 인쇄</button>

  `);
  win.document.close();
}

async function loadBcTypeNames() {
  const codes = ['BC-01','BC-02','BC-03','BC-04','BC-05','BC-06','BC-07','BC-08','BC-09','BC-10'];
  for (const code of codes) {
    const data = await api('GET', `/b2b/partner-view/${code}`);
    if (data && data.brand_name) {
      const btn = document.querySelector(`button[onclick="loadBcPrescription('${code}', null)"]`);

  const name = document.getElementById('pv-search-input').value.trim();
  if (!name) { toast('이름을 입력하세요', 'error'); return; }

  const area = document.getElementById('pv-result-area');
  area.innerHTML = '<div style="padding:24px;text-align:center;color:var(--muted)"><i class="fas fa-circle-notch fa-spin fa-2x"></i><p style="margin-top:12px">검색 중...</p></div>';

  const results = data.results || [];
  if (results.length === 0) {
    area.innerHTML = `

        </a>
      </div>

      <!-- 핵심 원인 -->
      <div style="background:${color}11;border-left:4px solid ${color};border-radius:0 10px 10px 0;padding:14px 18px;margin-bottom:16px">
        <div style="font-size:11px;font-weight:700;color:${color};margin-bottom:6px">🔍 핵심 원인</div>
        <div style="font-size:14px;line-height:1.7;color:var(--text)">${p.reason || '-'}</div>
      </div>

      <!-- 처방 3열 -->
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:16px">
        <!-- 올바른 원칙 -->
        <div style="background:#F0FDF4;border-radius:10px;padding:14px">
          <div style="font-size:11px;font-weight:700;color:#16A34A;margin-bottom:10px">✅ 핵심 원칙</div>
          ${(p.correct_principles||[]).slice(0,3).map(pp => `
            <div style="font-size:12px;color:var(--text);padding:6px 0;border-bottom:1px solid #DCFCE7;line-height:1.5">
              <strong>${pp.title||pp}</strong>${pp.description ? `<br><span style="color:var(--muted)">${pp.description}</span>` : ''}
            </div>`).join('') || '<div style="font-size:12px;color:var(--muted)">데이터 없음</div>'}
        </div>
        <!-- 권장 식품 -->
        <div style="background:#EFF6FF;border-radius:10px;padding:14px">
          <div style="font-size:11px;font-weight:700;color:#2563EB;margin-bottom:10px">🥗 권장 식품</div>
          ${(p.recommended_foods||[]).slice(0,3).map(f => `
            <div style="font-size:12px;color:var(--text);padding:5px 0;border-bottom:1px solid #DBEAFE">
              ${f.emoji||''} <strong>${f.name}</strong><br>
              <span style="color:var(--muted);font-size:11px">${f.reason||''}</span>
            </div>`).join('') || '<div style="font-size:12px;color:var(--muted)">데이터 없음</div>'}
        </div>
        <!-- 금기 식품 -->
        <div style="background:#FEF2F2;border-radius:10px;padding:14px">
          <div style="font-size:11px;font-weight:700;color:#DC2626;margin-bottom:10px">🚫 금기 식품</div>
          ${(p.forbidden_foods||[]).slice(0,3).map(f => `
            <div style="font-size:12px;color:var(--text);padding:5px 0;border-bottom:1px solid #FEE2E2">
              ${f.emoji||''} <strong>${f.name}</strong><br>
              <span style="color:var(--muted);font-size:11px">${f.reason||''}</span>
            </div>`).join('') || '<div style="font-size:12px;color:var(--muted)">데이터 없음</div>'}
        </div>
      </div>

      <!-- 생활습관 -->
      ${p.lifestyle_rules && p.lifestyle_rules.length > 0 ? `
      <div style="background:#FFFBEB;border-radius:10px;padding:14px">
        <div style="font-size:11px;font-weight:700;color:#D97706;margin-bottom:10px">📋 생활습관 처방</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          ${p.lifestyle_rules.slice(0,4).map(l => `
            <div style="background:#FEF3C7;border-radius:8px;padding:6px 12px;font-size:12px;color:var(--text)">
              ${l.icon||'💡'} ${l.rule||l}
            </div>`).join('')}
        </div>
      </div>` : ''}

      <div style="margin-top:14px;text-align:center">
        <button class="btn btn-ghost btn-sm" onclick="loadBcPrescription('${customer.bc_primary}', '${customer.user_name}')" style="border-color:${color};color:${color}">
          <i class="fas fa-expand-alt"></i> 전체 처방 상세보기
        </button>
      </div>
    </div>
  `;
}

async function loadBcPrescription(bcCode, customerName) {
  const color = BRAND.brand_color || '#6366f1';
  const area = document.getElementById('pv-prescription-area') || document.getElementById('pv-result-area');
  if (area) area.innerHTML = '<div style="padding:24px;text-align:center;color:var(--muted)"><i class="fas fa-circle-notch fa-spin fa-2x"></i></div>';

  const data = await api('GET', `/b2b/partner-view/${bcCode}`);
  if (!data || data.error) { toast('처방 데이터를 불러오지 못했습니다.', 'error'); return; }

  const tagEl = customerName ? `<div style="font-size:13px;color:var(--muted);margin-top:4px">검색 고객: ${customerName}</div>` : '';

  const renderList = (arr, color, icon) => arr.slice(0,4).map(item => `
    <div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
      <span style="color:${color};font-size:16px;flex-shrink:0">${item.emoji||icon}</span>
      <div>
        <div style="font-size:13px;font-weight:600">${item.name||item.title||item.rule||item}</div>
        ${item.reason||item.description ? `<div style="font-size:11px;color:var(--muted);margin-top:2px">${item.reason||item.description}</div>` : ''}
      </div>
    </div>`).join('');

  if (area) area.innerHTML = `
    <div class="card" style="border-top:4px solid ${color}">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px">
        <div>
          <div style="font-size:20px;font-weight:700">${data.brand_name}</div>
          ${tagEl}
          <div style="font-size:12px;color:${color};font-weight:600;margin-top:4px">${bcCode}</div>
        </div>
        <span class="badge" style="background:${color}22;color:${color}">${data.brand_name}</span>
      </div>

      <div style="background:${color}11;border-left:4px solid ${color};border-radius:0 10px 10px 0;padding:14px 18px;margin-bottom:20px">
        <div style="font-size:11px;font-weight:700;color:${color};margin-bottom:6px">🔍 핵심 원인 한 줄 설명</div>
        <div style="font-size:14px;line-height:1.7">${data.reason||'-'}</div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
        <div>
          <div style="font-size:12px;font-weight:700;color:#16A34A;margin-bottom:8px">✅ 권장 식품</div>
          ${renderList(data.recommended_foods||[], '#16A34A', '🥗')||'<div style="color:var(--muted);font-size:12px">데이터 없음</div>'}
        </div>
        <div>
          <div style="font-size:12px;font-weight:700;color:#DC2626;margin-bottom:8px">🚫 금기 식품</div>
          ${renderList(data.forbidden_foods||[], '#DC2626', '❌')||'<div style="color:var(--muted);font-size:12px">데이터 없음</div>'}
        </div>
      </div>

      ${data.correct_principles && data.correct_principles.length > 0 ? `
      <div style="margin-bottom:16px">
        <div style="font-size:12px;font-weight:700;color:#2563EB;margin-bottom:8px">💡 올바른 원칙</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          ${data.correct_principles.slice(0,4).map(p => `
            <div style="background:#EFF6FF;border-radius:8px;padding:10px 14px;font-size:12px">
              <strong>${p.title||p}</strong>${p.description ? `<br><span style="color:var(--muted)">${p.description}</span>` : ''}
            </div>`).join('')}
        </div>
      </div>` : ''}

      ${data.lifestyle_rules && data.lifestyle_rules.length > 0 ? `
      <div>
        <div style="font-size:12px;font-weight:700;color:#D97706;margin-bottom:8px">📋 생활습관 처방</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          ${data.lifestyle_rules.slice(0,5).map(l => `
            <div style="background:#FFFBEB;border-radius:8px;padding:6px 12px;font-size:12px">
              ${l.icon||'💡'} ${l.rule||l}
            </div>`).join('')}
        </div>
      </div>` : ''}
    </div>
  `;
}

// ─── 업체 정보 ───────────────────────────────
async function loadProfile() {
  const data = await api('GET', '/b2b/me');
  if (!data) return;
  const p = data.partner || {};
  const color = BRAND.brand_color || '#6366f1';

  document.getElementById('page-body').innerHTML = `
    <div class="card" style="max-width:600px">
      <div class="card-title"><i class="fas fa-building" style="color:${color}"></i> 업체 정보</div>
      <div style="display:grid;grid-template-columns:auto 1fr;gap:10px 24px;font-size:14px;line-height:2">
        <span style="color:var(--muted);font-weight:600">파트너 코드</span>
        <span><code style="color:${color};font-weight:700">${p.code || USER_CODE}</code></span>
        <span style="color:var(--muted);font-weight:600">영업장명</span>
        <span>${p.name || '-'}</span>
        <span style="color:var(--muted);font-weight:600">업종</span>
        <span>${p.type || '-'}</span>
        <span style="color:var(--muted);font-weight:600">원장명</span>
        <span>${p.owner_name || '-'}</span>
        <span style="color:var(--muted);font-weight:600">연락처</span>
        <span>${p.phone || '-'}</span>
        <span style="color:var(--muted);font-weight:600">이메일</span>
        <span>${p.email || '-'}</span>
        <span style="color:var(--muted);font-weight:600">브랜드명</span>
        <span style="color:${color};font-weight:700">${p.brand_name || p.name || '-'}</span>
        <span style="color:var(--muted);font-weight:600">브랜드 컬러</span>
        <span style="display:flex;align-items:center;gap:8px">
          <span style="width:20px;height:20px;border-radius:4px;background:${p.brand_color||color};display:inline-block"></span>
          <code>${p.brand_color || color}</code>
        </span>
        <span style="color:var(--muted);font-weight:600">로고</span>
        <span>${p.brand_logo_url ? `<img src="${p.brand_logo_url}" style="height:32px;border-radius:6px;object-fit:contain;background:#f8fafc;padding:2px;border:1px solid var(--border)">` : '미등록'}</span>
        <span style="color:var(--muted);font-weight:600">수수료율</span>
        <span>${p.commission_rate || 15}%</span>
        <span style="color:var(--muted);font-weight:600">상태</span>
        <span class="badge badge-green">${p.status || 'active'}</span>
      </div>
      <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)">
        정보 수정이 필요하시면 관리자에게 문의하세요.
      </div>
    </div>
    <div class="card" style="max-width:600px;margin-top:0">
      <div class="card-title"><i class="fas fa-link" style="color:${color}"></i> 고객 설문 링크</div>
      <div style="background:${color}11;border:1.5px solid ${color}44;border-radius:10px;padding:16px">
        <div style="font-size:13px;font-weight:700;color:${color};margin-bottom:8px">고객 전용 설문 URL</div>
        <div style="font-size:14px;word-break:break-all;margin-bottom:12px">${location.origin}/s/${USER_CODE}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="copyLink()"><i class="fas fa-copy"></i> 링크 복사</button>
          <button class="btn btn-ghost" onclick="navigateTo('qr')"><i class="fas fa-qrcode"></i> QR 출력</button>
        </div>
        <div style="font-size:12px;color:var(--muted);margin-top:10px">
          ✅ 이 링크로 접속하면 귀사 브랜드컬러와 로고가 자동으로 적용된 설문지가 열립니다
        </div>
      </div>
    </div>
  `;
}

// ─── 자동 로그인 확인 ─────────────────────────
if (TOKEN) {
  const savedBrand = localStorage.getItem('b2b_brand');
  if (savedBrand) { try { BRAND = JSON.parse(savedBrand); } catch(e) {} }

  fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${TOKEN}` } })
    .then(r => r.json())
    .then(data => {
      if (data.role === 'B2B_PARTNER') {
        // 브랜드 정보 새로고침
        fetch('/api/b2b/me', { headers: { 'Authorization': `Bearer ${TOKEN}` } })
          .then(r => r.json())
          .then(pData => {
            if (pData?.partner) {
              const p = pData.partner;
              BRAND = {
                brand_name: p.brand_name || p.name,
                brand_color: p.brand_color || '#6366f1',
                brand_logo_url: p.brand_logo_url || '',
              };
              localStorage.setItem('b2b_brand', JSON.stringify(BRAND));
            }
            initMain(data.name, data.code);
          })
          .catch(() => initMain(data.name, data.code));
      } else {
        doLogout();
      }
    })
    .catch(() => {
      TOKEN = '';
      document.getElementById('login-page').style.display = 'flex';
    });
} else {
  document.getElementById('login-page').style.display = 'flex';
}
</script>
</body>
</html>
