<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SlimMind B2B 파트너 포털</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* ── SlimMind 디자인 토큰 ── */
    :root {
      --sm-clay:   #b5452e;
      --sm-amber:  #c98a3c;
      --sm-teal:   #2f7d8c;
      --sm-forest: #5a6e3a;
      --sm-walnut: #7a4a38;
      --sm-ink:    #1a1a17;
      --sm-paper:  #f6f4ee;
      --sm-line:   #d8d3c6;
      --sm-muted:  #7c776b;
      --sm-card:   #fffdf8;

      --primary:      #b5452e;
      --primary-dark: #963a25;
      --accent:       #2f7d8c;
      --success:      #5a6e3a;
      --warn:         #c98a3c;
      --danger:       #dc2626;

      /* B2B 브랜드 오버라이드 (JS에서 동적 설정) */
      --brand:        #b5452e;
      --brand-light:  rgba(181,69,46,.12);

      --bg:     #f2f0ea;
      --card:   #fffdf8;
      --text:   #1a1a17;
      --muted:  #7c776b;
      --border: #e0dbd0;

      --sidebar-bg:    #1a1a17;
      --sidebar-width: 240px;
    }
    body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: break-word; }

    /* ── 로그인 ─── */
    #login-page {
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 24px;
      background: radial-gradient(ellipse at 25% 25%, rgba(181,69,46,.1) 0%, transparent 55%),
                  radial-gradient(ellipse at 75% 75%, rgba(47,125,140,.08) 0%, transparent 55%),
                  var(--bg);
    }
    .login-card {
      background: var(--card); border-radius: 24px; padding: 52px 44px;
      width: 100%; max-width: 420px;
      box-shadow: 0 2px 0 #d0c8bc, 0 8px 40px rgba(26,26,23,.12);
      border: 1px solid var(--border);
    }
    .login-logo { text-align: center; margin-bottom: 36px; }
    .login-logo-mark {
      width: 52px; height: 52px; border-radius: 15px;
      background: var(--primary); display: inline-flex; align-items: center;
      justify-content: center; margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(181,69,46,.35);
    }
    .login-logo-mark i { color: #fff; font-size: 20px; }
    .login-brand-badge { display: inline-block; background: var(--sm-teal); color: #fff; font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-bottom: 8px; letter-spacing: .06em; }
    .login-logo-text { font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -.02em; }
    .login-logo-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .login-field { margin-bottom: 16px; }
    .login-field label { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 7px; letter-spacing: .05em; text-transform: uppercase; }
    .login-field input {
      width: 100%; border: 1.5px solid var(--border); border-radius: 12px;
      padding: 13px 16px; font-size: 15px; font-family: inherit; outline: none;
      background: #fff; color: var(--text); transition: border-color .2s, box-shadow .2s;
    }
    .login-field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(181,69,46,.1); }
    .login-btn {
      width: 100%; background: var(--primary); color: #fff; border: none;
      border-radius: 12px; padding: 15px; font-size: 15px; font-weight: 700;
      cursor: pointer; font-family: inherit; margin-top: 10px;
      transition: background .2s, transform .1s;
      box-shadow: 0 4px 14px rgba(181,69,46,.3);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .login-btn:hover { background: var(--primary-dark); }
    .login-btn:active { transform: scale(.98); }
    .login-err { color: var(--danger); font-size: 13px; text-align: center; margin-top: 10px; display: none; background: rgba(220,38,38,.07); border-radius: 8px; padding: 10px; }
    .login-hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 16px; line-height: 1.7; }

    /* ── 레이아웃 ─── */
    #main-page { display: none; }
    .layout { display: flex; min-height: 100vh; }

    /* ── 사이드바 ─── */
    .sidebar {
      width: var(--sidebar-width); background: var(--sidebar-bg); color: #fff;
      display: flex; flex-direction: column; position: fixed; top: 0; left: 0;
      height: 100vh; z-index: 100;
    }
    .sidebar-logo {
      padding: 24px 20px 20px; border-bottom: 1px solid rgba(255,255,255,.1);
      display: flex; flex-direction: column; gap: 4px;
    }
    .sidebar-logo-inner { display: flex; align-items: center; gap: 10px; }
    .sidebar-logo-mark {
      width: 30px; height: 30px; border-radius: 8px; background: var(--sm-clay);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .sidebar-logo-mark i { color: #fff; font-size: 13px; }
    .sidebar-logo-text { font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
    .sidebar-logo-sub { font-size: 11px; color: rgba(255,255,255,.45); margin-top: 2px; }
    .sidebar-brand-name {
      font-size: 11px; margin-top: 8px; color: rgba(255,255,255,.7);
      background: rgba(255,255,255,.1); padding: 4px 10px;
      border-radius: 6px; display: inline-block; letter-spacing: .02em;
    }
    .sidebar-nav { flex: 1; padding: 10px 8px; overflow-y: auto; }
    .nav-item {
      display: flex; align-items: center; gap: 11px; padding: 11px 14px;
      cursor: pointer; font-size: 13.5px; font-weight: 500; transition: all .15s;
      border-radius: 10px; margin-bottom: 2px; color: rgba(255,255,255,.7);
    }
    .nav-item:hover { background: rgba(255,255,255,.08); color: #fff; }
    .nav-item.active { background: rgba(181,69,46,.25); color: #fff; border-left: 3px solid var(--sm-clay); }
    .nav-item i { width: 16px; text-align: center; font-size: 14px; }
    .sidebar-footer {
      padding: 16px 20px; border-top: 1px solid rgba(255,255,255,.1);
    }
    .sidebar-user { font-size: 12px; color: rgba(255,255,255,.5); margin-bottom: 10px; }
    .logout-btn {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: rgba(255,255,255,.5); cursor: pointer;
      padding: 8px 10px; border-radius: 8px; transition: all .15s;
    }
    .logout-btn:hover { color: #fff; background: rgba(255,255,255,.08); }

    /* ── 메인 ─── */
    .main-content { margin-left: var(--sidebar-width); flex: 1; min-height: 100vh; }
    .topbar {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 0 28px; height: 62px; display: flex; align-items: center;
      justify-content: space-between; position: sticky; top: 0; z-index: 50;
      box-shadow: 0 1px 0 var(--border);
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-title { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .topbar-user { font-size: 13px; color: var(--muted); }
    .topbar-notif-btn {
      position: relative; width: 36px; height: 36px; border-radius: 10px;
      background: none; border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .15s; color: var(--muted);
    }
    .topbar-notif-btn:hover { background: var(--bg); color: var(--sm-clay); border-color: var(--sm-clay); }
    .notif-dot-top {
      position: absolute; top: -3px; right: -3px; width: 9px; height: 9px;
      border-radius: 50%; background: var(--sm-clay); border: 2px solid var(--card);
    }
    .page-body { padding: 24px 28px; }

    /* ── 카드 ─── */
    .card {
      background: var(--card); border-radius: 16px; border: 1px solid var(--border);
      padding: 24px; margin-bottom: 20px;
      box-shadow: 0 1px 0 var(--border), 0 2px 8px rgba(26,26,23,.04);
    }
    .card-title { font-size: 15px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

    /* ── KPI ─── */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .kpi-card {
      background: var(--card); border-radius: 14px; border: 1px solid var(--border);
      padding: 20px 18px; position: relative; overflow: hidden;
      transition: transform .15s, box-shadow .15s;
    }
    .kpi-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    .kpi-icon {
      width: 38px; height: 38px; border-radius: 10px; margin-bottom: 12px;
      background: color-mix(in srgb, var(--brand) 12%, #fff);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: var(--brand);
    }
    .kpi-val { font-size: 30px; font-weight: 800; color: var(--brand); line-height: 1; letter-spacing: -.02em; }
    .kpi-label { font-size: 12px; color: var(--muted); margin-top: 6px; font-weight: 500; }

    /* ── 테이블 ─── */
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: var(--bg); padding: 10px 14px; text-align: left; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg); }

    /* ── 배지 ─── */
    .badge { display: inline-block; border-radius: 6px; padding: 3px 10px; font-size: 11px; font-weight: 700; }
    .badge-clay   { background: color-mix(in srgb, var(--sm-clay)   12%, #fff); color: var(--sm-clay); }
    .badge-teal   { background: color-mix(in srgb, var(--sm-teal)   12%, #fff); color: var(--sm-teal); }
    .badge-forest { background: color-mix(in srgb, var(--sm-forest) 12%, #fff); color: var(--sm-forest); }
    .badge-amber  { background: color-mix(in srgb, var(--sm-amber)  12%, #fff); color: var(--sm-amber); }
    .badge-gray   { background: var(--bg); color: var(--muted); }
    /* 기존 색 클래스 compat */
    .badge-purple { background: color-mix(in srgb, var(--sm-clay) 12%, #fff); color: var(--sm-clay); }
    .badge-green  { background: color-mix(in srgb, var(--sm-forest) 12%, #fff); color: var(--sm-forest); }
    .badge-blue   { background: color-mix(in srgb, var(--sm-teal) 12%, #fff); color: var(--sm-teal); }

    /* ── 버튼 ─── */
    .btn { border: none; border-radius: 9px; padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .15s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(181,69,46,.25); }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-ghost { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
    .btn-ghost:hover { background: var(--bg); border-color: var(--sm-clay); color: var(--sm-clay); }
    .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 7px; }

    /* ── 필터 ─── */
    .filter-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-row input, .filter-row select {
      border: 1.5px solid var(--border); border-radius: 10px; padding: 9px 14px;
      font-size: 13px; font-family: inherit; outline: none; background: var(--card);
      transition: border-color .2s;
    }
    .filter-row input:focus, .filter-row select:focus { border-color: var(--primary); }

    /* ── 결과 카드 ─── */
    .result-card {
      background: var(--card); border: 1.5px solid var(--border); border-radius: 14px;
      padding: 16px 18px; margin-bottom: 10px; display: flex; align-items: center;
      gap: 14px; cursor: pointer; transition: box-shadow .15s, border-color .15s;
    }
    .result-card:hover { box-shadow: 0 4px 16px rgba(181,69,46,.1); border-color: var(--sm-clay); }
    .result-icon {
      width: 46px; height: 46px; border-radius: 12px;
      background: color-mix(in srgb, var(--brand) 12%, #fff);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    .result-info { flex: 1; }
    .result-name { font-size: 14px; font-weight: 700; }
    .result-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .result-nick { font-size: 13px; font-weight: 600; color: var(--brand); margin-top: 3px; }

    /* ── QR 섹션 ─── */
    .qr-section { text-align: center; padding: 24px; }
    .qr-url { font-size: 13px; color: var(--sm-teal); word-break: break-all; margin: 12px 0; background: color-mix(in srgb, var(--sm-teal) 8%, #fff); padding: 10px 16px; border-radius: 10px; }

    /* ── 파트너 뷰 카드 ─── */
    .partner-view-card { border: 1.5px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .partner-view-card.rec1 { border-left: 4px solid var(--sm-forest); }
    .partner-view-card.rec2 { border-left: 4px solid var(--sm-teal); }
    .partner-view-card.forbid { border-left: 4px solid var(--danger); }
    .pv-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
    .pv-text { font-size: 14px; color: var(--text); line-height: 1.6; }

    /* ── 알림 아이템 ─── */
    .notif-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 14px 16px; border-radius: 12px; margin-bottom: 8px;
      cursor: pointer; transition: background .15s;
      border: 1.5px solid transparent;
    }
    .notif-item:hover { background: var(--bg); }
    .notif-item.unread { background: color-mix(in srgb, var(--sm-clay) 6%, #fff); border-color: color-mix(in srgb, var(--sm-clay) 20%, #eee); }
    .notif-item-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sm-clay); margin-top: 5px; flex-shrink: 0; }
    .notif-item:not(.unread) .notif-item-dot { background: var(--border); }
    .notif-item-body { flex: 1; }

    /* ── 빈 상태 ─── */
    .empty-state { text-align: center; padding: 48px; color: var(--muted); }
    .empty-state i { font-size: 36px; margin-bottom: 12px; opacity: .4; display: block; }
    .empty-state p { font-size: 14px; line-height: 1.7; }

    /* ── 토스트 ─── */
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast { background: var(--sm-ink); color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; box-shadow: 0 4px 20px rgba(0,0,0,.2); animation: slideIn .3s ease; max-width: 320px; }
    .toast.success { background: var(--sm-forest); }
    .toast.error { background: var(--danger); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* ── 브랜드 배너 ─── */
    .brand-banner { border-radius: 16px; padding: 20px 24px; margin-bottom: 24px; display: flex; align-items: center; gap: 16px; color: #fff; }
    .brand-logo-img { width: 52px; height: 52px; object-fit: contain; border-radius: 10px; background: rgba(255,255,255,.2); padding: 4px; }

    /* ── 차트 ─── */
    .chart-wrap { position: relative; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main-content { margin-left: 0; }
      .kpi-grid { grid-template-columns: 1fr 1fr; }
      .topbar { padding: 0 16px; }
      .page-body { padding: 16px; }
    }
  </style>
</head>
<body>

<div class="toast-container" id="toast-container"></div>

<!-- 로그인 페이지 -->
<div id="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-mark"><i class="fas fa-building"></i></div>
      <div class="login-brand-badge">B2B PARTNER</div>
      <div class="login-logo-text">SlimMind</div>
      <div class="login-logo-sub">B2B 파트너 포털</div>
    </div>
    <div class="login-field">
      <label>파트너 코드</label>
      <input type="text" id="login-code" placeholder="B2B-AES-001" autocomplete="off"
        onkeydown="if(event.key==='Enter') doLogin()">
    </div>
    <div class="login-field">
      <label>비밀번호</label>
      <input type="password" id="login-pw" placeholder="초기 비밀번호"
        onkeydown="if(event.key==='Enter') doLogin()">
    </div>
    <button class="login-btn" onclick="doLogin()"><i class="fas fa-sign-in-alt"></i> 파트너 로그인</button>
    <div class="login-err" id="login-err"></div>
    <div class="login-hint">
      코드와 초기 비밀번호는 관리자에게 문의하세요<br>
      마스터 관리자: <a href="/admin" style="color:var(--primary)">관리자 페이지</a>
    </div>
  </div>
</div>

<!-- 메인 페이지 -->
<div id="main-page">
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-inner">
          <div class="sidebar-logo-mark"><i class="fas fa-leaf"></i></div>
          <div>
            <div class="sidebar-logo-text">SlimMind</div>
            <div class="sidebar-logo-sub">B2B 파트너 포털</div>
          </div>
        </div>
        <div class="sidebar-brand-name" id="sidebar-brand-name-badge"></div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-item active" data-page="dashboard"><i class="fas fa-chart-pie"></i> 대시보드</div>
        <div class="nav-item" data-page="customers"><i class="fas fa-users"></i> 고객 결과 조회</div>
        <div class="nav-item" data-page="daily-checks"><i class="fas fa-check-square"></i> 데일리 체크 <span style="font-size:9px;background:#5a6e3a;color:#fff;border-radius:4px;padding:1px 5px;margin-left:2px;font-weight:700">NEW</span></div>
        <div class="nav-item" data-page="notifications"><i class="fas fa-bell"></i> 알림<span id="b2b-notif-badge" style="display:none;background:var(--sm-clay);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;margin-left:6px">0</span></div>
        <div class="nav-item" data-page="qr"><i class="fas fa-qrcode"></i> QR 코드</div>
        <div class="nav-item" data-page="partner-view"><i class="fas fa-star"></i> 파트너 추천 뷰</div>
        <div class="nav-item" data-page="bc-library"><i class="fas fa-dna"></i> 바디코드 도감</div>
        <div class="nav-item" data-page="subaccounts"><i class="fas fa-user-friends"></i> 직원 계정 관리</div>
        <div class="nav-item" data-page="profile"><i class="fas fa-building"></i> 업체 정보</div>
        <div class="nav-item" data-page="guide"><i class="fas fa-book-open"></i> 이용 안내</div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user" id="sidebar-user"></div>
        <a href="https://pf.kakao.com/_xgCgsX/chat" target="_blank"
           style="display:flex;align-items:center;gap:8px;background:#FEE500;color:#3C1E1E;border-radius:8px;padding:9px 12px;font-size:12px;font-weight:700;text-decoration:none;margin-bottom:10px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#3C1E1E"><path d="M12 2C6.48 2 2 5.92 2 10.73c0 2.98 1.67 5.6 4.19 7.22l-.97 3.57 4.1-2.72c.87.16 1.76.24 2.68.24 5.52 0 10-3.92 10-8.77S17.52 2 12 2z"/></svg>
          본사 채팅 문의
        </a>
        <div class="logout-btn" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> 로그아웃</div>
      </div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <div class="topbar-left">
          <div class="topbar-title" id="topbar-title">대시보드</div>
        </div>
        <div class="topbar-right">
          <span class="topbar-user" id="topbar-user"></span>
          <button class="topbar-notif-btn" onclick="navigateTo('notifications')" title="알림">
            <i class="fas fa-bell" style="font-size:15px"></i>
            <span class="notif-dot-top" id="b2b-notif-dot" style="display:none"></span>
          </button>
        </div>
      </div>
      <div class="page-body" id="page-body">
        <div style="padding:40px;text-align:center;color:var(--muted)"><i class="fas fa-circle-notch fa-spin fa-2x"></i></div>
      </div>
    </main>
  </div>
</div>

<script>
// ─── 전역 상태 ────────────────────────────────
// 마스터 대리접속: sm_b2b_token이 있으면 우선 사용
const _impB2BToken = localStorage.getItem('sm_b2b_token');
if (_impB2BToken && new URLSearchParams(location.search).get('_impersonate') === '1') {
  localStorage.setItem('b2b_token', _impB2BToken);
}
let TOKEN = localStorage.getItem('b2b_token') || '';
let USER_CODE = localStorage.getItem('b2b_code') || '';
let USER_INFO = null;
let BRAND = {};
let currentPage = 'dashboard';

// ─── API 헬퍼 ────────────────────────────────
async function api(method, path, body) {
  try {
    const opts = {
      method,
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
    };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch('/api' + path, opts);
    const data = await res.json();
    if (res.status === 401) { doLogout(); return null; }
    return data;
  } catch (e) {
    toast('네트워크 오류', 'error');
    return null;
  }
}

// ─── 토스트 ──────────────────────────────────
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ─── 날짜 포맷 ───────────────────────────────
function fmtDate(s) {
  if (!s) return '-';
  return new Date(s).toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

// ─── 로그인 ──────────────────────────────────
async function doLogin() {
  const code = document.getElementById('login-code').value.trim().toUpperCase();
  const pw = document.getElementById('login-pw').value;
  const errEl = document.getElementById('login-err');
  errEl.style.display = 'none';

  if (!code || !pw) { errEl.textContent = '코드와 비밀번호를 입력하세요.'; errEl.style.display = 'block'; return; }
  if (!code.startsWith('B2B-')) { errEl.textContent = 'B2B 파트너 코드는 B2B-로 시작합니다.'; errEl.style.display = 'block'; return; }

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, password: pw })
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || '로그인 실패'; errEl.style.display = 'block'; return; }
    if (data.role !== 'B2B_PARTNER') { errEl.textContent = 'B2B 파트너 계정으로만 접근 가능합니다.'; errEl.style.display = 'block'; return; }

    TOKEN = data.token;
    USER_CODE = data.code;
    BRAND = {
      brand_name: data.brand_name,
      brand_color: data.brand_color || '#6366f1',
      brand_logo_url: data.brand_logo_url || '',
    };
    localStorage.setItem('b2b_token', TOKEN);
    localStorage.setItem('b2b_code', USER_CODE);
    localStorage.setItem('b2b_brand', JSON.stringify(BRAND));

    initMain(data.name, data.code);
  } catch (e) {
    errEl.textContent = '서버 오류가 발생했습니다.'; errEl.style.display = 'block';
  }
}

function doLogout() {
  TOKEN = ''; USER_CODE = '';
  localStorage.removeItem('b2b_token');
  localStorage.removeItem('b2b_code');
  localStorage.removeItem('b2b_brand');
  document.getElementById('login-page').style.display = 'flex';
  document.getElementById('main-page').style.display = 'none';
}

function initMain(name, code) {
  // 브랜드 컬러 적용 (B2B 브랜드컬러가 있으면 override, 없으면 SlimMind clay)
  const color = BRAND.brand_color || '#b5452e';
  document.documentElement.style.setProperty('--brand', color);
  document.documentElement.style.setProperty('--brand-light', color + '22');

  // 사이드바 브랜드명·코드
  const brandBadge = document.getElementById('sidebar-brand-name-badge');
  if (brandBadge) brandBadge.textContent = (BRAND.brand_name ? BRAND.brand_name + ' · ' : '') + code;
  const userEl = document.getElementById('sidebar-user');
  if (userEl) userEl.textContent = '담당자: ' + name;
  const topbarUser = document.getElementById('topbar-user');
  if (topbarUser) topbarUser.textContent = name;

  document.getElementById('login-page').style.display = 'none';
  document.getElementById('main-page').style.display = 'block';
  navigateTo('dashboard');
}

// ─── 내비게이션 ──────────────────────────────
document.querySelectorAll('.nav-item').forEach(el => {
  el.onclick = () => navigateTo(el.dataset.page);
});

function navigateTo(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  const titles = {
    dashboard: '대시보드',
    customers: '고객 결과 조회',
    'daily-checks': '데일리 체크 현황',
    notifications: '알림',
    qr: 'QR 코드 출력',
    'partner-view': '파트너 추천 뷰',
    'bc-library': '바디코드 도감',
    subaccounts: '직원 계정 관리',
    profile: '업체 정보',
    guide: '이용 안내',
  };
  document.getElementById('topbar-title').textContent = titles[page] || page;
  const body = document.getElementById('page-body');
  body.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted)"><i class="fas fa-circle-notch fa-spin fa-2x"></i></div>';

  if (page === 'dashboard')      loadDashboard();
  else if (page === 'customers')      loadCustomers();
  else if (page === 'notifications')  loadB2bNotifications();
  else if (page === 'qr')             loadQR();
  else if (page === 'partner-view')   loadPartnerView();
  else if (page === 'bc-library')     loadB2bBcLibrary();
  else if (page === 'subaccounts')    loadSubaccounts();
  else if (page === 'profile')        loadProfile();
  else if (page === 'guide')          loadGuideB2B();
  else if (page === 'daily-checks')   loadB2bDailyChecks();
}

// ══════════════════════════════════════════════════════════
//  데일리 체크 현황 탭 (파트너 소속 고객 실천 모니터링)
// ══════════════════════════════════════════════════════════
async function loadB2bDailyChecks(days = 7) {
  const body = document.getElementById('page-body');
  body.innerHTML = `<div style="padding:40px;text-align:center;color:var(--muted)"><i class="fas fa-circle-notch fa-spin fa-2x"></i></div>`;

  const data = await api('GET', `/b2b/daily-checks?days=${days}`).catch(() => null);
  const clients = data?.clients || [];

  function bar(pct, color) {
    const p = Math.min(100, pct||0);
    return `<div style="background:#f0ece6;border-radius:5px;height:6px;width:70px;overflow:hidden;display:inline-block;vertical-align:middle;"><div style="background:${color};width:${p}%;height:100%;border-radius:5px;"></div></div><span style="font-size:11px;font-weight:700;color:#555;margin-left:4px;">${p}%</span>`;
  }

  const rows = clients.map((cl, i) => {
    const rate = cl.adherence_rate || 0;
    const color = rate >= 80 ? '#5a6e3a' : rate >= 50 ? '#c98a3c' : '#b5452e';
    const daysSince = cl.last_check ? Math.floor((Date.now()-new Date(cl.last_check).getTime())/86400000) : 999;
    const alert = daysSince >= 3 ? `<span style="color:#b5452e;font-size:11px" title="${daysSince}일 전 마지막 체크">⚠️</span>` : '';
    return `<tr style="border-bottom:1px solid #f0ece6;">
      <td style="padding:10px 12px;font-weight:700;font-size:13px">${cl.user_name||'이름없음'} ${alert}</td>
      <td style="padding:10px 12px"><span style="background:#faf0dc;color:#8a5a18;border-radius:8px;padding:2px 8px;font-size:11px;font-weight:700">${cl.bc_code||'—'}</span></td>
      <td style="padding:10px 12px;text-align:center;font-size:13px;font-weight:800;color:#5a6e3a">${cl.ex_days||0}</td>
      <td style="padding:10px 12px;text-align:center;font-size:13px;font-weight:800;color:#c98a3c">${cl.di_days||0}</td>
      <td style="padding:10px 12px;text-align:center;font-size:13px;font-weight:800;color:#b5452e">${cl.re_days||0}</td>
      <td style="padding:10px 12px">${bar(rate, color)}</td>
      <td style="padding:10px 12px;font-size:11px;color:#aaa">${cl.last_check ? cl.last_check.slice(0,10) : '—'}</td>
    </tr>`;
  }).join('');

  // 전체 평균 실천율
  const avgRate = clients.length
    ? Math.round(clients.reduce((s, c) => s + (c.adherence_rate||0), 0) / clients.length)
    : 0;

  body.innerHTML = `
    <div style="padding:20px 24px">
      <div style="font-size:18px;font-weight:900;color:#241c14;margin-bottom:6px">📊 소속 고객 데일리 체크 현황</div>
      <div style="font-size:12px;color:#aaa;margin-bottom:18px">고객이 결과지 "오늘" 탭에서 체크한 운동·식단·회복 실천 현황</div>

      <!-- 요약 -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px">
        <div style="background:linear-gradient(135deg,#fdfaf4,#fff8ee);border:1.5px solid #e8c07a;border-radius:12px;padding:14px 16px">
          <div style="font-size:11px;font-weight:800;color:#8a7e66;margin-bottom:4px">체크 고객수</div>
          <div style="font-size:26px;font-weight:900;color:#241c14">${clients.length}<span style="font-size:13px;color:#aaa;font-weight:600"> 명</span></div>
        </div>
        <div style="background:linear-gradient(135deg,#eef4e0,#f3f7ea);border:1.5px solid #cdd9b0;border-radius:12px;padding:14px 16px">
          <div style="font-size:11px;font-weight:800;color:#5a7040;margin-bottom:4px">평균 실천율</div>
          <div style="font-size:26px;font-weight:900;color:#3f5022">${avgRate}<span style="font-size:13px;color:#aaa;font-weight:600"> %</span></div>
        </div>
        <div style="background:linear-gradient(135deg,#fdeee7,#fdf0eb);border:1.5px solid #f0c4b3;border-radius:12px;padding:14px 16px">
          <div style="font-size:11px;font-weight:800;color:#8f321e;margin-bottom:4px">⚠️ 주의 고객</div>
          <div style="font-size:26px;font-weight:900;color:#b5452e">${clients.filter(c => (c.last_check ? Math.floor((Date.now()-new Date(c.last_check).getTime())/86400000) : 999) >= 3).length}<span style="font-size:13px;color:#aaa;font-weight:600"> 명</span></div>
        </div>
      </div>

      <!-- 기간 필터 -->
      <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
        ${[3,7,14,30].map(d => `<button onclick="loadB2bDailyChecks(${d})" style="padding:6px 16px;border-radius:20px;border:1.5px solid ${days===d?'var(--sm-green)':'#e0d8cc'};background:${days===d?'var(--sm-green,#5a6e3a)':'transparent'};color:${days===d?'#fff':'#555'};font-size:12px;font-weight:800;cursor:pointer">${d}일</button>`).join('')}
      </div>

      <!-- 테이블 -->
      <div style="background:#fff;border-radius:12px;border:1.5px solid #e8ddd0;overflow:hidden">
        <table style="width:100%;border-collapse:collapse">
          <thead>
            <tr style="background:linear-gradient(135deg,#fdfaf4,#fff8ee)">
              <th style="padding:10px 12px;text-align:left;font-size:11px;font-weight:800;color:#8a7e66">고객명</th>
              <th style="padding:10px 12px;text-align:left;font-size:11px;font-weight:800;color:#8a7e66">BC</th>
              <th style="padding:10px 12px;text-align:center;font-size:11px;font-weight:800;color:#5a6e3a">🏃운동</th>
              <th style="padding:10px 12px;text-align:center;font-size:11px;font-weight:800;color:#c98a3c">🍽식단</th>
              <th style="padding:10px 12px;text-align:center;font-size:11px;font-weight:800;color:#b5452e">🌙회복</th>
              <th style="padding:10px 12px;text-align:left;font-size:11px;font-weight:800;color:#8a7e66">실천율</th>
              <th style="padding:10px 12px;text-align:left;font-size:11px;font-weight:800;color:#8a7e66">마지막</th>
            </tr>
          </thead>
          <tbody>
            ${rows || `<tr><td colspan="7" style="padding:40px;text-align:center;color:#aaa;font-size:13px">아직 체크 데이터가 없습니다<br><span style="font-size:11px">고객이 결과지 "오늘" 탭에서 체크하면 여기에 표시됩니다</span></td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

// ═══════════════════════════════════════
//  B2B 바디코드 도감 (파트너 힌트 포함)
// ═══════════════════════════════════════
// ── SlimMind V4.7 BC코드 체계 (BC-1~9) ──
const B2B_BC_COLORS = {
  'BC-1':'#1A7FC1','BC-2':'#5A6E3A','BC-3':'#E8631A',
  'BC-4':'#6B4EAA','BC-5':'#C0397A','BC-6':'#3F51B5',
  'BC-7':'#1A8C5B','BC-8':'#E67E22','BC-9':'#607D8B'
};
const B2B_BC_ICONS  = {
  'BC-1':'🐘','BC-2':'🐢','BC-3':'🍉',
  'BC-4':'🔄','BC-5':'🍊','BC-6':'🦉',
  'BC-7':'🎈','BC-8':'🦵','BC-9':'🕷️'
};

async function loadB2bBcLibrary() {
  const body = document.getElementById('page-body');
  body.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap">
      <h2 style="margin:0;font-size:18px;font-weight:700;color:#fff"><i class="fas fa-dna" style="margin-right:8px"></i>바디코드 도감</h2>
      <span style="font-size:11px;background:rgba(255,255,255,.2);color:#fff;padding:2px 10px;border-radius:99px">파트너 추천 가이드 포함</span>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:16px">
      <input type="text" id="b2b-bc-search" placeholder="🔍 코드명·특징 검색..." oninput="b2bBcFilter()"
        style="flex:1;padding:10px 14px;border:none;border-radius:8px;font-size:14px">
    </div>
    <div id="b2b-bc-cards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px">
      <div style="text-align:center;padding:60px;grid-column:1/-1;color:rgba(255,255,255,.6)">
        <i class="fas fa-circle-notch fa-spin fa-2x"></i>
      </div>
    </div>`;

  const data = await api('GET', '/b2b/bc-list');
  if (!data?.ok) {
    document.getElementById('b2b-bc-cards').innerHTML = `<div style="color:#fca5a5;padding:40px">로드 실패: ${data?.error||''}</div>`;
    return;
  }
  window._b2bBcList = data.list;
  renderB2bBcCards(data.list);
}

function b2bBcFilter() {
  if (window._b2bBcList) renderB2bBcCards(window._b2bBcList);
}

function renderB2bBcCards(list) {
  const search = (document.getElementById('b2b-bc-search')?.value || '').toLowerCase();
  const area = document.getElementById('b2b-bc-cards');
  if (!area) return;
  const filtered = search ? list.filter(bc => `${bc.bc_code} ${bc.brand_name} ${bc.tagline} ${bc.reason||''}`.toLowerCase().includes(search)) : list;
  if (!filtered.length) { area.innerHTML = `<div style="text-align:center;padding:40px;grid-column:1/-1;color:rgba(255,255,255,.5)">검색 결과 없음</div>`; return; }
  area.innerHTML = filtered.map(bc => renderB2bBcCard(bc)).join('');
}

function renderB2bBcCard(bc) {
  const color = B2B_BC_COLORS[bc.bc_code] || '#6366F1';
  const icon  = B2B_BC_ICONS[bc.bc_code] || '🧬';
  const cid = 'b2bbc-' + bc.bc_code.replace('-','');
  const foods = (bc.recommended_foods||[]).slice(0,5).join(', ') || '—';
  const forbidden = (bc.forbidden_foods||[]).slice(0,4).join(', ') || '—';
  const exercises = (bc.recommended_exercises||[]).slice(0,3).join(', ') || '—';
  const supplements = (bc.supplement_list||[]).slice(0,3).join(', ') || '—';
  const symptoms = (bc.symptom_checklist||[]).slice(0,4);
  const principles = (bc.correct_principles||[]).slice(0,3);
  const lifestyle = (bc.lifestyle_rules||[]).slice(0,3);

  // B2B 전용: 파트너 힌트
  const hints = bc.partner_hints || [];
  const treatments = bc.b2b_treatments || {};
  const treatKeys = Object.keys(treatments).slice(0,4);

  return `<div style="background:#fff;border-radius:14px;overflow:hidden;margin-bottom:0">
    <div style="background:${color}15;border-bottom:2px solid ${color}40;padding:14px 16px;cursor:pointer" onclick="b2bBcToggle('${cid}')">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:24px">${icon}</span>
          <div>
            <div style="display:flex;align-items:center;gap:6px">
              <span style="background:${color};color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px">${bc.bc_code}</span>
              <span style="font-size:14px;font-weight:800;color:#1F2937">${bc.brand_name}</span>
            </div>
            <div style="font-size:11px;color:#6B7280;margin-top:2px">${bc.tagline||''}</div>
          </div>
        </div>
        <i class="fas fa-chevron-down" id="${cid}-chev" style="color:${color};transition:transform .3s;font-size:12px"></i>
      </div>
      ${bc.reason ? `<div style="margin-top:8px;background:${color}15;border-left:3px solid ${color};padding:6px 10px;border-radius:0 6px 6px 0;font-size:12px;color:#374151"><strong>핵심:</strong> ${bc.reason}</div>` : ''}
    </div>
    <div id="${cid}" style="display:none;padding:14px 16px;font-size:13px">
      ${bc.fat_area ? `<div style="margin-bottom:10px;color:#374151"><strong>지방 부위:</strong> ${bc.fat_area}</div>` : ''}
      ${bc.cause_story ? `<div style="background:#F9FAFB;border-radius:8px;padding:10px;margin-bottom:10px;color:#4B5563;line-height:1.7;font-size:12px"><strong>원인 스토리</strong><br>${bc.cause_story}</div>` : ''}
      ${symptoms.length ? `<div style="margin-bottom:10px"><strong style="font-size:12px">자가진단</strong><br>${symptoms.map(s=>`<div style="font-size:12px;color:#4B5563">✓ ${s}</div>`).join('')}</div>` : ''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
        <div style="background:#ECFDF5;border-radius:8px;padding:8px"><div style="font-size:10px;font-weight:700;color:#065F46;margin-bottom:3px">✅ 권장 식품</div><div style="font-size:11px;color:#065F46">${foods}</div></div>
        <div style="background:#FEF2F2;border-radius:8px;padding:8px"><div style="font-size:10px;font-weight:700;color:#991B1B;margin-bottom:3px">❌ 금지 식품</div><div style="font-size:11px;color:#991B1B">${forbidden}</div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
        <div style="background:#EEF2FF;border-radius:8px;padding:8px"><div style="font-size:10px;font-weight:700;color:#3730A3;margin-bottom:3px">🏃 추천 운동</div><div style="font-size:11px;color:#3730A3">${exercises}</div></div>
        <div style="background:#FFF7ED;border-radius:8px;padding:8px"><div style="font-size:10px;font-weight:700;color:#92400E;margin-bottom:3px">💊 보충제</div><div style="font-size:11px;color:#92400E">${supplements}</div></div>
      </div>
      ${principles.length ? `<div style="margin-bottom:8px"><strong style="font-size:12px;color:#374151">올바른 원칙</strong><br>${principles.map(p=>`<div style="font-size:12px;color:#4B5563">→ ${p}</div>`).join('')}</div>` : ''}
      ${lifestyle.length ? `<div style="margin-bottom:8px"><strong style="font-size:12px;color:#374151">생활습관</strong><br>${lifestyle.map(l=>`<div style="font-size:12px;color:#4B5563">• ${l}</div>`).join('')}</div>` : ''}

      <!-- ★ B2B 전용: 파트너 추천 프로그램 -->
      ${hints.length > 0 ? `
      <div style="background:#FFF7ED;border:1px solid #FED7AA;border-radius:10px;padding:12px;margin-top:10px;margin-bottom:8px">
        <div style="font-size:12px;font-weight:800;color:#C2410C;margin-bottom:8px">⭐ 파트너 추천 포인트</div>
        ${hints.map(h=>`<div style="font-size:12px;color:#92400E;padding:3px 0">→ ${h}</div>`).join('')}
      </div>` : ''}

      ${treatKeys.length > 0 ? `
      <div style="background:#EEF2FF;border:1px solid #C7D2FE;border-radius:10px;padding:12px;margin-bottom:8px">

          <div style="font-size:11px;color:#4338CA;margin-top:2px">${Array.isArray(treatments[k]) ? treatments[k].slice(0,3).join(', ') : treatments[k]}</div>
        </div>`).join('')}
      </div>` : ''}

      ${bc.closing_copy ? `<div style="background:${color}10;border-radius:8px;padding:8px;font-size:12px;font-style:italic;color:${color};text-align:center;font-weight:600">"${bc.closing_copy}"</div>` : ''}
      <button onclick="b2bBcToggle('${cid}')" style="width:100%;margin-top:10px;background:none;border:1px solid #E5E7EB;border-radius:6px;padding:6px;font-size:11px;color:#6B7280;cursor:pointer">접기 ▲</button>
    </div>
  </div>`;
}

function b2bBcToggle(id) {
  const el = document.getElementById(id);
  const chev = document.getElementById(id+'-chev');
  if (!el) return;
  const open = el.style.display !== 'none';
  el.style.display = open ? 'none' : 'block';
  if (chev) chev.style.transform = open ? 'rotate(0deg)' : 'rotate(180deg)';
}

function generateMiniQR() {
  const qrEl = document.getElementById('mini-qr');
  if (!qrEl) return;
  if (!USER_CODE) {
    qrEl.innerHTML = `<div style="font-size:12px;color:var(--muted);padding:12px;text-align:center">로그인 후 대시보드를 로드하면 QR코드가 생성됩니다</div>`;
    return;
  }
  const url = `${location.origin}/s/${USER_CODE}`;
  qrEl.innerHTML = `<div style="background:#fff;padding:12px;border:1.5px solid var(--border);border-radius:10px;display:inline-block">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(url)}" 
      alt="QR" style="width:120px;height:120px;display:block">
  </div>
  <div style="font-size:11px;color:var(--muted);margin-top:8px">${url}</div>`;
}

function copyLink(url) {
  const target = url || (USER_CODE ? `${location.origin}/s/${USER_CODE}` : null);
  if (!target) {
    toast('로그인 후 대시보드를 먼저 열어주세요.', 'error');
    return;
  }
  navigator.clipboard.writeText(target).then(() => toast('링크가 복사되었습니다! 📋', 'success'));
}

// ── 카카오톡 공유 ──────────────────────────────
function shareKakao(url, title, desc) {
  const shareUrl  = url  || (USER_CODE ? `${location.origin}/s/${USER_CODE}` : null);
  if (!shareUrl) {
    toast('로그인 후 대시보드를 먼저 열어주세요.', 'error');
    return;
  }
  const shareTitle = title || `${BRAND.brand_name || 'SlimMind'} | 바디코드 정밀 진단`;
  const shareDesc  = desc  || '나만의 체형 설계도를 무료로 확인해보세요. 1분 설문으로 바디코드 분석이 시작됩니다.';
  // 카카오 SDK 없이 URL 공유 — 모바일: 카카오링크 딥링크, PC: 링크 복사 fallback
  if (navigator.share) {
    navigator.share({ title: shareTitle, text: shareDesc, url: shareUrl })
      .catch(() => copyLink(shareUrl));
  } else {
    copyLink(shareUrl);
    toast('링크를 복사했습니다. 카카오톡에 붙여넣기 하세요! 💬', 'success');
  }
}

// ─── B2B 알림 ──────────────────────────────
async function loadB2bNotifications() {
  const body = document.getElementById('page-body');

  const data = await api('GET', `/notifications?ref_code=${USER_CODE}&limit=50`);
  const notifs = data?.notifications || [];
  const unread = notifs.filter(n => !n.is_read).length;

  // 뱃지 업데이트
  const dot = document.getElementById('b2b-notif-dot');
  const badge = document.getElementById('b2b-notif-badge');
  if (dot)   dot.style.display   = unread > 0 ? 'block' : 'none';
  if (badge) { badge.textContent = unread; badge.style.display = unread > 0 ? 'inline-block' : 'none'; }

  const notifHtml = notifs.length === 0
    ? `<div class="empty-state">
        <i class="fas fa-bell-slash"></i>
        <p>아직 도착한 알림이 없습니다<br><span style="font-size:12px">고객이 설문을 완료하면 알림이 표시됩니다</span></p>
       </div>`
    : notifs.map(n => {
        const dt = (n.notified_at || '').replace('T', ' ').slice(0, 16);
        const isNew = !n.is_read;
        return `<div class="notif-item${isNew ? ' unread' : ''}" onclick="markB2bNotifRead('${n.id}', this)">
          <div class="notif-item-dot"></div>
          <div class="notif-item-body">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
              ${isNew ? '<span style="background:var(--sm-clay);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px">NEW</span>' : ''}
              <span style="font-size:13px;font-weight:700">고객 설문 완료</span>
              <span style="font-size:12px;color:var(--muted);margin-left:auto">${dt}</span>
            </div>
            <div style="font-size:13px;color:var(--muted)">결과 ID: <code style="background:var(--bg);padding:1px 6px;border-radius:4px;font-size:12px">${n.result_id || '-'}</code></div>
          </div>
        </div>`;
      }).join('');

  body.innerHTML = `
    <div style="max-width:720px;margin:0 auto">
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
          <div style="display:flex;align-items:center;gap:12px">
            <div style="width:44px;height:44px;background:color-mix(in srgb,var(--sm-clay) 12%,#fff);border-radius:12px;display:flex;align-items:center;justify-content:center">
              <i class="fas fa-bell" style="color:var(--sm-clay);font-size:18px"></i>
            </div>
            <div>
              <div style="font-size:17px;font-weight:800">설문 완료 알림</div>
              <div style="font-size:12px;color:var(--muted)">파트너 코드로 연결된 설문 완료 알림</div>
            </div>
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-ghost btn-sm" onclick="loadB2bNotifications()"><i class="fas fa-sync"></i> 새로고침</button>
            <button class="btn btn-ghost btn-sm" onclick="markAllB2bNotifRead()"><i class="fas fa-check-double"></i> 전체 읽음</button>
          </div>
        </div>
        <div id="b2b-notif-list">${notifHtml}</div>
      </div>
    </div>
  `;
}

async function markB2bNotifRead(id, el) {
  if (!id) return;
  await api('POST', `/notifications/read`, { ids: [Number(id)] });
  if (el) {
    el.classList.remove('unread');
    const newBadge = el.querySelector('span[style*="sm-clay"]');
    if (newBadge) newBadge.remove();
  }
}

async function markAllB2bNotifRead() {
  await api('POST', `/notifications/read-all?ref_code=${USER_CODE}`);
  toast('✅ 전체 읽음 처리됨', 'success');
  loadB2bNotifications();
}

// ─── 결과지 토큰 링크 (B2B 전용) ────────────
async function openB2bResult(resultId) {
  try {
    const res = await api('GET', `/b2b/result-link/${resultId}`);
    if (res?.url) {
      window.open(res.url, '_blank');
    } else {
      window.open(`/result/${resultId}`, '_blank');
    }
  } catch(e) {
    window.open(`/result/${resultId}`, '_blank');
  }
}

async function copyB2bResultLink(resultId) {
  try {
    const res = await api('GET', `/b2b/result-link/${resultId}`);
    const url = res?.url || `${location.origin}/result/${resultId}`;
    navigator.clipboard.writeText(url).then(() => toast('📋 결과지 링크가 복사되었습니다.', 'success'));
  } catch(e) {
    navigator.clipboard.writeText(`${location.origin}/result/${resultId}`).then(() => toast('📋 링크 복사 완료!', 'success'));
  }
}

// SlimMind V4.7 BC-1~9 체형명 정적 매핑
const BC_NAMES = {
  'BC-1':'코끼리다리형 (하지 림프·정맥 울혈)',
  'BC-2':'거북이형 (경추·흉추 림프 차단)',
  'BC-3':'수박배형 (인슐린 저항성·내장 비대)',
  'BC-4':'요요형 (갑상선 셧다운·초절전)',
  'BC-5':'귤껍질형 (바탕질 변성·지방 섬유화)',
  'BC-6':'야식부엉이형 (부신 피로·자율신경 교란)',
  'BC-7':'바람빠진풍선형 (릴랙신 이완·산후 구조 정체)',
  'BC-8':'말벅지형 (알파수용체 우세·하체 과발달)',
  'BC-9':'올챙이배형 (근감소성 이화작용·마른 비만)'
};
function loadBcTypeNames() {
  Object.entries(BC_NAMES).forEach(([code, name]) => {
    const btn = document.querySelector(`button[onclick="loadBcPrescription('${code}', null)"]`);
    if (btn) btn.innerHTML = `<span style="font-size:10px;opacity:.7">${code}</span> ${name}`;
  });
}

async function searchPartnerView() {
  const name = document.getElementById('pv-search-input').value.trim();
  if (!name) { toast('이름을 입력하세요', 'error'); return; }
  const color = BRAND.brand_color || '#6366f1';
  const area = document.getElementById('pv-result-area');
  area.innerHTML = '<div style="padding:24px;text-align:center;color:var(--muted)"><i class="fas fa-circle-notch fa-spin fa-2x"></i><p style="margin-top:12px">검색 중...</p></div>';

  const data = await api('GET', `/b2b/customer-lookup?name=${encodeURIComponent(name)}`);
  if (!data) return;

  const results = data.results || [];
  if (results.length === 0) {
    area.innerHTML = `
      <div class="card">
        <div class="empty-state">
          <i class="fas fa-user-slash"></i>
          <p><strong>"${name}"</strong> 이름의 고객을 찾을 수 없습니다.<br>
          전용 설문 링크로 설문을 완료한 고객만 조회됩니다.</p>
        </div>
      </div>`;
    return;
  }

  // 고객이 1명이면 바로 처방 표시, 여러 명이면 선택
  if (results.length === 1) {
    showCustomerPrescription(results[0], color);
  } else {
    area.innerHTML = `
      <div class="card">
        <div class="card-title"><i class="fas fa-users" style="color:${color}"></i> "${name}" 검색 결과 (${results.length}명)</div>
        ${results.map((r,i) => `
          <div class="result-card" onclick='showCustomerPrescription(${JSON.stringify(r).replace(/'/g,"&#39;")}, "${color}")' style="margin-bottom:10px">
            <div class="result-icon" style="background:${color}22;color:${color}"><i class="fas fa-user"></i></div>
            <div class="result-info">
              <div class="result-name">${r.user_name}</div>
              <div class="result-meta">${fmtDate(r.created_at)}</div>
              <div class="result-nick">${r.bc_primary || '-'}</div>
            </div>
            <i class="fas fa-chevron-right" style="color:var(--muted)"></i>
          </div>
        `).join('')}
      </div>`;
  }
}

// ── B2B 파트너 전용 해석 + 업체 등록 프로그램 자동 로드 ──────
async function loadB2bPartnerRxAuto(bcCode, customerId, color) {
  if (!color) color = BRAND.brand_color || '#6366f1';
  const container = document.getElementById(`b2b-partner-rx-${customerId}`);
  if (!container) return;

  // 처방 해석 데이터 + 업체 등록 프로그램 병렬 로드
  const [partnerData, myPrograms] = await Promise.all([
    api('GET', `/b2b/partner-view/${bcCode}`),
    api('GET', `/b2b/my-programs/${bcCode}`),
  ]);

  let html = '';

  // 1) 파트너 전용 해석 (기존 renderB2bPartnerRxPanel)
  if (partnerData && !partnerData.error) {
    html += renderB2bPartnerRxPanel(partnerData, color);
  }

  // 2) 업체 등록 프로그램 섹션
  const matched = myPrograms?.matched_programs || [];
  const general = myPrograms?.general_programs || [];

  if (matched.length > 0 || general.length > 0) {
    const programCard = (p) => `
      <div style="background:#fff;border:1.5px solid ${color}33;border-radius:12px;padding:14px 16px;flex:0 0 auto;min-width:180px;max-width:220px">
        <div style="font-size:13px;font-weight:700;color:#1f2937;margin-bottom:4px;word-break:keep-all">${p.program_name}</div>
        ${p.price ? `<div style="font-size:13px;color:${color};font-weight:700;margin-bottom:6px">₩${Number(p.price).toLocaleString()}~</div>` : ''}
        ${p.description ? `<div style="font-size:11px;color:#6b7280;line-height:1.5;margin-bottom:6px;word-break:keep-all">${p.description}</div>` : ''}
        ${p.tags ? `<div style="display:flex;flex-wrap:wrap;gap:3px">
          ${p.tags.split(',').filter(Boolean).slice(0,3).map(tag =>
            `<span style="font-size:10px;background:${color}18;color:${color};padding:2px 7px;border-radius:20px">${tag.trim()}</span>`
          ).join('')}
        </div>` : ''}
      </div>`;

    html += `
      <div style="border-top:2px dashed ${color}44;margin-top:4px;padding-top:14px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
          <span style="background:${color};color:#fff;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700">🏥 우리 업체 추천 프로그램</span>
          <span style="font-size:11px;color:var(--muted)">${bcCode} 맞춤 · ${matched.length}개 매칭</span>
        </div>
        ${matched.length > 0 ? `
          <div style="display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch">
            ${matched.map(programCard).join('')}
          </div>` : `
          <div style="font-size:13px;color:var(--muted);padding:12px 0;background:#f8fafc;border-radius:8px;text-align:center">
            <i class="fas fa-info-circle" style="margin-right:6px"></i>${bcCode} 태그가 달린 등록 프로그램이 없습니다.
          </div>`}
        ${general.length > 0 ? `
          <div style="margin-top:12px">
            <div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px">📋 기타 업체 프로그램</div>
            <div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:4px">
              ${general.map(programCard).join('')}
            </div>
          </div>` : ''}
      </div>`;
  } else {
    // 등록된 프로그램 없음 → 안내 버튼
    html += `
      <div style="border-top:2px dashed ${color}44;margin-top:4px;padding-top:14px">
        <div style="background:#F8FAFC;border:1.5px solid var(--border);border-radius:10px;padding:14px 16px;text-align:center;font-size:13px;color:var(--muted)">
          <i class="fas fa-plus-circle" style="color:${color};margin-bottom:6px;display:block;font-size:22px"></i>
          아직 등록된 프로그램이 없습니다.<br>
          <span style="font-size:12px">업체 정보 → 프로그램 등록 메뉴에서 추가하시면<br>BC코드에 맞게 자동으로 추천됩니다.</span>
        </div>
      </div>`;
  }

  if (!html) {
    container.innerHTML = `<div style="color:var(--muted);font-size:13px;text-align:center;padding:12px">파트너 데이터를 불러올 수 없습니다.</div>`;
    return;
  }
  container.innerHTML = html;
}

  // BC코드 직접 선택 시에도 업체 등록 프로그램 자동 로드

async function loadBcPartnerSection(bcCode, color) {
  const containerId = `bc-partner-section-${bcCode.replace('-','')}`;
  const container = document.getElementById(containerId);
  if (!container) return;

  const [partnerData, myPrograms] = await Promise.all([
    api('GET', `/b2b/partner-view/${bcCode}`),
    api('GET', `/b2b/my-programs/${bcCode}`),
  ]);

  let html = '';

  if (partnerData && !partnerData.error) {
    html += renderB2bPartnerRxPanel(partnerData, color);
  }

  const matched = myPrograms?.matched_programs || [];
  const general = myPrograms?.general_programs || [];

  const programCard = (p) => `
    <div style="background:#fff;border:1.5px solid ${color}33;border-radius:12px;padding:14px 16px;flex:0 0 auto;min-width:180px;max-width:220px">
      <div style="font-size:13px;font-weight:700;color:#1f2937;margin-bottom:4px;word-break:keep-all">${p.program_name}</div>
      ${p.price ? `<div style="font-size:13px;color:${color};font-weight:700;margin-bottom:6px">₩${Number(p.price).toLocaleString()}~</div>` : ''}
      ${p.description ? `<div style="font-size:11px;color:#6b7280;line-height:1.5;margin-bottom:6px;word-break:keep-all">${p.description}</div>` : ''}
      ${p.tags ? `<div style="display:flex;flex-wrap:wrap;gap:3px">
        ${p.tags.split(',').filter(Boolean).slice(0,3).map(tag =>
          `<span style="font-size:10px;background:${color}18;color:${color};padding:2px 7px;border-radius:20px">${tag.trim()}</span>`
        ).join('')}
      </div>` : ''}
    </div>`;

  if (matched.length > 0 || general.length > 0) {
    html += `
      <div style="border-top:2px dashed ${color}44;margin-top:4px;padding-top:14px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
          <span style="background:${color};color:#fff;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700">🏥 우리 업체 추천 프로그램</span>
          <span style="font-size:11px;color:var(--muted)">${bcCode} 맞춤 · ${matched.length}개 매칭</span>
        </div>
        ${matched.length > 0 ? `
          <div style="display:flex;gap:12px;overflow-x:auto;padding-bottom:8px">
            ${matched.map(programCard).join('')}
          </div>` : `
          <div style="font-size:13px;color:var(--muted);padding:12px;background:#f8fafc;border-radius:8px;text-align:center">
            <i class="fas fa-info-circle" style="margin-right:6px"></i>${bcCode} 태그 프로그램이 없습니다.
          </div>`}
        ${general.length > 0 ? `
          <div style="margin-top:12px">
            <div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px">📋 기타 업체 프로그램</div>
            <div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:4px">
              ${general.map(programCard).join('')}
            </div>
          </div>` : ''}
      </div>`;
  } else {
    html += `
      <div style="border-top:2px dashed ${color}44;margin-top:4px;padding-top:14px">
        <div style="background:#F8FAFC;border:1.5px solid var(--border);border-radius:10px;padding:14px 16px;text-align:center;font-size:13px;color:var(--muted)">
          <i class="fas fa-plus-circle" style="color:${color};margin-bottom:6px;display:block;font-size:22px"></i>
          아직 등록된 프로그램이 없습니다.<br>
          <span style="font-size:12px">업체 정보 메뉴에서 프로그램을 등록하시면<br>BC코드별로 자동 추천됩니다.</span>
        </div>
      </div>`;
  }

  container.innerHTML = html || `<div style="color:var(--muted);font-size:13px;text-align:center;padding:12px">파트너 데이터가 없습니다.</div>`;
}

// ── B2B 파트너 전용 해석 HTML 생성 공통 함수 ─────────────────
function renderB2bPartnerRxPanel(data, color) {
  const hints = data.partner_hints || [];
  // b2b_treatments: 배열 [{type, treatments[], revisit}] 또는 객체 형식 모두 지원
  const rawTreat = data.b2b_treatments || [];
  const treatArr = Array.isArray(rawTreat)
    ? rawTreat   // [{type:'병원', treatments:[...], revisit:'...'}]
    : Object.entries(rawTreat).map(([k,v]) => ({type:k, treatments: Array.isArray(v)?v:[v]}));
  const consultPoints = data.consulting_points || [];
  const wrongMethods = data.wrong_methods || [];
  const typeIcons = {'병원':'🏥','에스테틱':'✨','헬스장':'💪','필라테스':'🧘','한의원':'🌿','약국':'💊','성형외과':'💉','기타':'🏢'};

  const hasContent = hints.length || treatArr.length || consultPoints.length || wrongMethods.length;
  if (!hasContent) return '';

  return `
    <div style="border-top:2px dashed ${color}44;margin-top:4px;padding-top:14px">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:12px">
        <span style="background:${color};color:#fff;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700">★ 파트너 전용</span>
        <span style="font-size:12px;color:var(--muted)">B2B 파트너만 볼 수 있는 전문가 해석 자료</span>
      </div>

      ${hints.length > 0 ? `
      <!-- 파트너 추천 포인트 -->
      <div style="background:#FFF7ED;border:1px solid #FED7AA;border-radius:10px;padding:12px 16px;margin-bottom:12px">
        <div style="font-size:12px;font-weight:800;color:#C2410C;margin-bottom:10px">⭐ 파트너 추천 포인트</div>
        <div style="display:flex;flex-direction:column;gap:7px">
          ${hints.map((h,i) => `
            <div style="display:flex;gap:8px;align-items:flex-start">
              <span style="background:#C2410C;color:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px">${i+1}</span>
              <span style="font-size:13px;color:#92400E;line-height:1.6">${h}</span>
            </div>`).join('')}
        </div>
      </div>` : ''}

      ${treatArr.length > 0 ? `
      <!-- 업종별 추천 프로그램 -->
      <div style="background:#EEF2FF;border:1px solid #C7D2FE;border-radius:10px;padding:12px 16px;margin-bottom:12px">
        <div style="font-size:12px;font-weight:800;color:#4338CA;margin-bottom:12px">🏥 업종별 추천 프로그램</div>
        <div style="display:flex;flex-direction:column;gap:12px">
          ${treatArr.map(t => {
            const typeName = t.type || '기타';
            const items = Array.isArray(t.treatments) ? t.treatments : (t.treatments ? [t.treatments] : []);
            return `
            <div style="border-bottom:1px solid #C7D2FE;padding-bottom:10px">
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
                <span style="font-size:16px">${typeIcons[typeName.replace(/[()·\s].*/,'')]||'🏥'}</span>
                <span style="font-size:12px;font-weight:700;color:#4338CA">${typeName}</span>
              </div>
              <div style="display:flex;flex-direction:column;gap:4px">
                ${items.slice(0,5).map(item =>
                  `<div style="font-size:12px;color:#3730A3;padding-left:8px;line-height:1.6">→ ${item}</div>`
                ).join('')}
              </div>
              ${t.revisit ? `<div style="font-size:11px;color:#6366f1;margin-top:6px;padding-left:8px;font-style:italic">💡 재방문 전략: ${t.revisit}</div>` : ''}
            </div>`;
          }).join('')}
        </div>
      </div>` : ''}

      ${consultPoints.length > 0 ? `
      <!-- 상담 포인트 -->
      <div style="background:#F0F9FF;border:1px solid #BAE6FD;border-radius:10px;padding:12px 16px">
        <div style="font-size:12px;font-weight:800;color:#0284C7;margin-bottom:10px">💬 상담 포인트</div>
        <div style="display:flex;flex-direction:column;gap:6px">
          ${consultPoints.slice(0,5).map((pt,i) => `
            <div style="display:flex;gap:8px;align-items:flex-start">
              <span style="background:#0284C7;color:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px">${i+1}</span>
              <span style="font-size:12px;color:var(--text);line-height:1.6">${pt}</span>
            </div>`).join('')}
        </div>
      </div>` : ''}
    </div>
  `;
}

async function createSubaccount() {
  const name = document.getElementById('sub-name').value.trim();
  const roleLabel = document.getElementById('sub-role').value.trim();
  const password = document.getElementById('sub-pw').value.trim();
  if (!name) { toast('직원 이름을 입력하세요.', 'error'); return; }
  if (!password || password.length < 4) { toast('비밀번호는 4자 이상이어야 합니다.', 'error'); return; }

  const res = await api('POST', '/b2b/subaccounts', { name, role_label: roleLabel, password });
  if (res?.success) {
    toast(`✅ ${res.code} 계정이 생성되었습니다.`, 'success');
    loadSubaccounts();
  } else {
    toast('생성 실패: ' + (res?.error || '오류'), 'error');
  }
}

async function deleteSubaccount(code, name) {
  if (!confirm(`"${name}" (${code}) 계정을 삭제하시겠습니까?\n삭제 후에는 복구할 수 없습니다.`)) return;
  const res = await api('DELETE', `/b2b/subaccounts/${code}`);
  if (res?.success) {
    toast(`🗑️ ${code} 계정이 삭제되었습니다.`, 'success');
    loadSubaccounts();
  } else {
    toast('삭제 실패: ' + (res?.error || '오류'), 'error');
  }
}

function copySubLoginInfo(code, name) {
  const text = `[SlimMind B2B 로그인 정보]\n이름: ${name}\n계정 코드: ${code}\n로그인: ${location.origin}/b2b`;
  navigator.clipboard.writeText(text).then(() => toast('📋 로그인 정보가 복사되었습니다.', 'success'));
}

// ─── 자동 로그인 확인 ─────────────────────────
if (TOKEN) {
  const savedBrand = localStorage.getItem('b2b_brand');
  if (savedBrand) { try { BRAND = JSON.parse(savedBrand); } catch(e) {} }

  fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${TOKEN}` } })
    .then(r => r.json())
    .then(data => {
      if (data.role === 'B2B_PARTNER') {
        // ✅ USER_CODE를 서버 응답에서 확실히 갱신 (localStorage 값이 비어있는 경우 방어)
        if (data.code) {
          USER_CODE = data.code;
          localStorage.setItem('b2b_code', USER_CODE);
        }
        // 브랜드 정보 새로고침
        fetch('/api/b2b/me', { headers: { 'Authorization': `Bearer ${TOKEN}` } })
          .then(r => r.json())
          .then(pData => {
            if (pData?.partner) {
              const p = pData.partner;
              BRAND = {
                brand_name: p.brand_name || p.name,
                brand_color: p.brand_color || '#6366f1',
                brand_logo_url: p.brand_logo_url || '',
              };
              localStorage.setItem('b2b_brand', JSON.stringify(BRAND));
            }
            initMain(data.name, data.code);
          })
          .catch(() => initMain(data.name, data.code));
      } else {
        doLogout();
      }
    })
    .catch(() => {
      TOKEN = '';
      document.getElementById('login-page').style.display = 'flex';
    });
} else {
  document.getElementById('login-page').style.display = 'flex';
}
</script>
</body>
</html>
