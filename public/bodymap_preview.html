<!DOCTYPE html>
<html lang='ko'>
<head>
<meta charset='UTF-8'>
<title>바디맵 미리보기</title>
<style>
body { background:#1a1a2e; font-family:sans-serif; padding:20px; margin:0; }
h2 { color:#fff; text-align:center; margin-bottom:20px; font-size:16px; }
.grid { display:grid; grid-template-columns: repeat(5, 1fr); gap:12px; max-width:900px; margin:0 auto; }
.card { background:#16213e; border-radius:10px; padding:10px; text-align:center; border:1px solid #2a2a4e; }
.label { color:#cbd5e1; font-size:10px; margin-top:6px; font-weight:bold; }
.legend { color:#94A3B8; font-size:8px; margin-top:3px; line-height:1.5; }
</style>
</head>
<body>
<h2>파라메트릭 SVG 바디맵 — 10종 미리보기</h2>
<div class='grid' id='grid'></div>
<script>
function generateBodyMap(res, bcCode) {
  const ss = res.survey_summary || {};

  // ── 파라미터 추출 ───────────────────────────────────────
  const gender        = (ss.gender || res.gender || 'female');
  const bmi           = parseFloat(ss.bmi || res.bmi || 22);
  const bcScores      = res.bc_scores || {};
  const stressLevel   = parseFloat(ss.stress_level || 2);       // 1~4
  const sleepHours    = parseFloat(ss.sleep_hours || 7);        // 0(불규칙),4.5,6,7.5
  const bodyState     = (ss.body_state || 'mixed');             // Q05
  const coldParts     = ss.cold_body_parts || [];               // Q62 array
  const numbParts     = ss.numb_body_parts || [];               // Q58 array
  const fatGainOrder  = (ss.fat_gain_order || 'all_over');      // Q78
  const breathingType = (ss.breathing_type || 'belly');         // Q61
  const sittingPost   = (ss.sitting_posture || 'upright');      // Q72
  const walkAngle     = (ss.walking_foot_angle || 'straight');  // Q63
  const activityLvl   = (ss.daily_activity || 'moderate');      // Q73
  const dreamAction   = (ss.dream_action || '');                // Q80
  const bellyFatThick = (ss.belly_fat_thickness || 'medium');   // Q75

  // ── BC코드별 컬러 팔레트 ────────────────────────────────
  const bcPalette = {
    'BC-01': { primary:'#E74C3C', secondary:'#FADBD8', accent:'#C0392B', glow:'rgba(231,76,60,.18)' },
    'BC-02': { primary:'#E67E22', secondary:'#FDEBD0', accent:'#CA6F1E', glow:'rgba(230,126,34,.18)' },
    'BC-03': { primary:'#F39C12', secondary:'#FEF9E7', accent:'#D4AC0D', glow:'rgba(243,156,18,.18)' },
    'BC-04': { primary:'#795548', secondary:'#EFEBE9', accent:'#5D4037', glow:'rgba(121,85,72,.18)'  },
    'BC-05': { primary:'#9B59B6', secondary:'#F4ECF7', accent:'#7D3C98', glow:'rgba(155,89,182,.18)' },
    'BC-06': { primary:'#2980B9', secondary:'#D6EAF8', accent:'#1A5276', glow:'rgba(41,128,185,.18)' },
    'BC-07': { primary:'#1ABC9C', secondary:'#D5F5E3', accent:'#148F77', glow:'rgba(26,188,156,.18)' },
    'BC-08': { primary:'#7F8C8D', secondary:'#EAEDED', accent:'#566573', glow:'rgba(127,140,141,.18)' },
    'BC-09': { primary:'#2C3E50', secondary:'#D5D8DC', accent:'#1C2833', glow:'rgba(44,62,80,.22)'   },
    'BC-10': { primary:'#8E44AD', secondary:'#E8DAEF', accent:'#6C3483', glow:'rgba(142,68,173,.18)' },
  };
  const pal = bcPalette[bcCode] || bcPalette['BC-07'];

  // ── 실루엣 두께: BMI 기반 ──────────────────────────────
  // BMI 18.5 미만 → 슬림, 18.5~23 → 표준, 23~27 → 통통, 27+ → 글로벌
  const bmiTier = bmi < 18.5 ? 0 : bmi < 23 ? 1 : bmi < 27 ? 2 : 3;
  // 실루엣 path 폭 배율 (1.0 = 표준)
  const widthScale = [0.82, 1.0, 1.16, 1.30][bmiTier];

  // ── 부위별 강조 결정 ───────────────────────────────────
  // fat_gain_order + bcCode로 어느 부위가 강조되는지 결정
  const zoneHighlight = {
    belly_first:  ['upper_belly','lower_belly'],
    hip_first:    ['thigh','hip'],
    upper_first:  ['shoulder','arm'],
    all_over:     ['upper_belly','thigh','shoulder'],
    face_first:   ['face','neck'],
  }[fatGainOrder] || ['upper_belly'];

  // BC코드별 추가 강조 부위
  const bcZoneBonus = {
    'BC-01': ['upper_belly'],
    'BC-02': ['upper_belly','lower_belly'],
    'BC-03': ['shoulder','arm'],
    'BC-04': ['waist','lower_back'],
    'BC-05': ['thigh','hip'],
    'BC-06': ['thigh','calf','foot'],
    'BC-07': ['whole'],
    'BC-08': ['whole'],
    'BC-09': ['upper_belly'],
    'BC-10': ['upper_belly','thigh'],
  }[bcCode] || [];
  const allHighlight = [...new Set([...zoneHighlight, ...bcZoneBonus])];

  // ── 차가운 부위: Q62 → 파란 오버레이 ──────────────────
  const coldZoneMap = { hands:'arm', feet:'foot', knee:'knee', thigh:'thigh', lower_back:'lower_back' };
  const coldZones = (Array.isArray(coldParts) ? coldParts : []).map(p => coldZoneMap[p]).filter(Boolean);

  // ── 감각없는 부위: Q58 → 점선 오버레이 ───────────────
  const numbZoneMap = { glute:'hip', hamstring:'thigh', core:'upper_belly', back:'lower_back', shoulder:'shoulder' };
  const numbZones = (Array.isArray(numbParts) ? numbParts : []).map(p => numbZoneMap[p]).filter(Boolean);

  // ── 스트레스 레벨 → 상단 긴장선 ──────────────────────
  const stressTension = Math.min(4, Math.max(1, stressLevel));

  // ── 수면 → 눈 아래 다크서클 표현 ─────────────────────
  const sleepBad = (sleepHours === 0 || sleepHours <= 5);

  // ── 자세 → 척추 곡선 편향 ─────────────────────────────
  const spinalLean = { upright:0, slouch:-6, tilted:5, crossed:3 }[sittingPost] || 0;

  // ── 발 각도 → 발끝 방향 ───────────────────────────────
  const footAngle = { straight:0, out:22, in:-18, unknown:0 }[walkAngle] || 0;

  // ── 호흡 타입 → 가슴/복부 강조 ───────────────────────
  const chestBreather = (breathingType === 'chest');

  // ── 활동량 → 근육 윤곽선 두께 ────────────────────────
  const muscleDef = { sedentary:0, light:0.5, moderate:1, active:2 }[activityLvl] || 1;

  // ── 꿈 행동 → 발 아래 아이콘 ─────────────────────────
  const dreamIcon = { clothes:'👗', travel:'🏖️', photo:'📸', active:'🏃', health:'🩺', love:'💑' }[dreamAction] || '';

  // ── SVG 생성 시작 ───────────────────────────────────────
  // 뷰박스 기준: 200 × 380
  // 실루엣 중심 x=100, 머리 상단 y=18

  // 성별 기반 실루엣 파라미터
  const isFemale = (gender === 'female');
  const w = widthScale;

  // 핵심 x좌표 계산 (중심=100 기준)
  const shoulderW = isFemale ? 44*w : 52*w;   // 어깨 반폭
  const waistW    = isFemale ? 32*w : 38*w;    // 허리 반폭
  const hipW      = isFemale ? 50*w : 44*w;    // 엉덩이 반폭
  const thighW    = isFemale ? 26*w : 24*w;    // 허벅지 반폭
  const calfW     = isFemale ? 18*w : 16*w;    // 종아리 반폭
  const cx = 100 + spinalLean;                  // 척추 중심

  // Y 좌표 기준점
  const headY   = 28;   // 머리 중심
  const neckY   = 52;
  const shouldY = 72;
  const chestY  = 110;
  const waistY  = 148;
  const hipY    = 178;
  const thighY  = 230;
  const kneeY   = 270;
  const calfY   = 310;
  const footY   = 350;
  const groundY = 368;

  // ── 실루엣 path (좌측 + 우측) ──────────────────────────
  // 좌측 path (cx에서 왼쪽)
  const bodyPath = `
    M ${cx} ${neckY}
    C ${cx-shoulderW*0.3} ${neckY+4}, ${cx-shoulderW} ${shouldY-4}, ${cx-shoulderW} ${shouldY}
    C ${cx-shoulderW*1.05} ${chestY-10}, ${cx-shoulderW*(chestBreather?1.1:1.0)} ${chestY}, ${cx-waistW*1.1} ${chestY+20}
    C ${cx-waistW*1.05} ${waistY-10}, ${cx-waistW} ${waistY}, ${cx-hipW*0.85} ${hipY-10}
    C ${cx-hipW} ${hipY}, ${cx-hipW*1.02} ${hipY+16}, ${cx-thighW*1.1} ${thighY-20}
    C ${cx-thighW} ${thighY}, ${cx-thighW*0.9} ${kneeY-10}, ${cx-calfW*1.1} ${kneeY}
    C ${cx-calfW*1.05} ${kneeY+14}, ${cx-calfW} ${calfY}, ${cx-calfW*0.9} ${footY-10}
    L ${cx-calfW*0.85} ${footY}
    L ${cx-calfW*1.3} ${groundY}
    L ${cx+calfW*1.3} ${groundY}
    L ${cx+calfW*0.85} ${footY}
    C ${cx+calfW} ${calfY}, ${cx+calfW*1.05} ${kneeY+14}, ${cx+calfW*1.1} ${kneeY}
    C ${cx+thighW*0.9} ${kneeY-10}, ${cx+thighW} ${thighY}, ${cx+thighW*1.1} ${thighY-20}
    C ${cx+hipW*1.02} ${hipY+16}, ${cx+hipW} ${hipY}, ${cx+hipW*0.85} ${hipY-10}
    C ${cx+waistW} ${waistY}, ${cx+waistW*1.05} ${waistY-10}, ${cx+waistW*1.1} ${chestY+20}
    C ${cx+shoulderW*(chestBreather?1.1:1.0)} ${chestY}, ${cx+shoulderW*1.05} ${chestY-10}, ${cx+shoulderW} ${shouldY}
    C ${cx+shoulderW} ${shouldY-4}, ${cx+shoulderW*0.3} ${neckY+4}, ${cx} ${neckY}
    Z
  `;

  // ── 부위별 오버레이 레이어 생성 ──────────────────────────
  // zone → SVG ellipse/rect 정의
  const zoneShapes = {
    upper_belly: `<ellipse cx="${cx}" cy="${(chestY+waistY)/2}" rx="${waistW*1.05}" ry="20" />`,
    lower_belly: `<ellipse cx="${cx}" cy="${(waistY+hipY)/2}" rx="${hipW*0.75}" ry="18" />`,
    shoulder:    `<ellipse cx="${cx-shoulderW*0.7}" cy="${shouldY+4}" rx="14" ry="10" /><ellipse cx="${cx+shoulderW*0.7}" cy="${shouldY+4}" rx="14" ry="10" />`,
    arm:         `<ellipse cx="${cx-shoulderW*1.02}" cy="${chestY+10}" rx="10" ry="22" /><ellipse cx="${cx+shoulderW*1.02}" cy="${chestY+10}" rx="10" ry="22" />`,
    waist:       `<ellipse cx="${cx}" cy="${waistY}" rx="${waistW}" ry="14" />`,
    lower_back:  `<ellipse cx="${cx}" cy="${hipY-8}" rx="${hipW*0.65}" ry="12" />`,
    hip:         `<ellipse cx="${cx}" cy="${hipY+8}" rx="${hipW*0.9}" ry="16" />`,
    thigh:       `<ellipse cx="${cx-thighW*0.6}" cy="${(hipY+kneeY)/2}" rx="${thighW*0.85}" ry="28" /><ellipse cx="${cx+thighW*0.6}" cy="${(hipY+kneeY)/2}" rx="${thighW*0.85}" ry="28" />`,
    knee:        `<ellipse cx="${cx-calfW*0.9}" cy="${kneeY+4}" rx="10" ry="8" /><ellipse cx="${cx+calfW*0.9}" cy="${kneeY+4}" rx="10" ry="8" />`,
    calf:        `<ellipse cx="${cx-calfW*0.7}" cy="${(kneeY+footY)/2}" rx="${calfW*0.8}" ry="22" /><ellipse cx="${cx+calfW*0.7}" cy="${(kneeY+footY)/2}" rx="${calfW*0.8}" ry="22" />`,
    foot:        `<ellipse cx="${cx-calfW*0.95}" cy="${groundY-4}" rx="12" ry="6" /><ellipse cx="${cx+calfW*0.95}" cy="${groundY-4}" rx="12" ry="6" />`,
    whole:       `<rect x="${cx-shoulderW*1.1}" y="${neckY}" width="${shoulderW*2.2}" height="${groundY-neckY}" rx="8" />`,
    face:        `<ellipse cx="${cx}" cy="${headY}" rx="18" ry="20" />`,
    neck:        `<ellipse cx="${cx}" cy="${(headY+shouldY)/2+2}" rx="10" ry="10" />`,
  };

  // 강조 부위 → 주 색상 오버레이 (반투명)
  const highlightSVG = allHighlight.map(zone => {
    const shape = zoneShapes[zone];
    if(!shape) return '';
    return `<g fill="${pal.primary}" opacity="0.22">${shape}</g>`;
  }).join('');

  // 차가운 부위 → 파란 오버레이
  const coldSVG = coldZones.map(zone => {
    const shape = zoneShapes[zone];
    if(!shape) return '';
    return `<g fill="#2980B9" opacity="0.28">${shape}</g>`;
  }).join('');

  // 감각없는 부위 → 점선 테두리
  const numbSVG = numbZones.map(zone => {
    const shape = zoneShapes[zone];
    if(!shape) return '';
    // fill 없이 stroke 점선으로 변환
    return `<g fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.7">${shape}</g>`;
  }).join('');

  // ── 스트레스 긴장선: 어깨~목 사이 물결 ───────────────
  const tensionLines = stressTension >= 3 ? `
    <path d="M ${cx-shoulderW*0.9} ${shouldY+2} Q ${cx} ${shouldY-4*stressTension} ${cx+shoulderW*0.9} ${shouldY+2}"
          fill="none" stroke="${pal.primary}" stroke-width="${stressTension*0.5}" opacity="0.4" stroke-dasharray="2,3"/>
    <path d="M ${cx-shoulderW*0.7} ${shouldY+8} Q ${cx} ${shouldY-2*stressTension} ${cx+shoulderW*0.7} ${shouldY+8}"
          fill="none" stroke="${pal.primary}" stroke-width="${stressTension*0.4}" opacity="0.25" stroke-dasharray="2,3"/>
  ` : '';

  // ── 수면 부족 → 눈 아래 다크서클 ────────────────────
  const darkCircleSVG = sleepBad ? `
    <ellipse cx="${cx-7}" cy="${headY+5}" rx="6" ry="3" fill="#7F8C8D" opacity="0.3"/>
    <ellipse cx="${cx+7}" cy="${headY+5}" rx="6" ry="3" fill="#7F8C8D" opacity="0.3"/>
  ` : '';

  // ── 발끝 방향 표시 ────────────────────────────────────
  const footRotL = `rotate(${-footAngle} ${cx-calfW*0.95} ${groundY})`;
  const footRotR = `rotate(${footAngle}  ${cx+calfW*0.95} ${groundY})`;

  // ── 복식/흉식 호흡 → 가슴 강조선 ────────────────────
  const breathSVG = chestBreather ? `
    <ellipse cx="${cx}" cy="${chestY+5}" rx="${shoulderW*0.7}" ry="14"
             fill="none" stroke="${pal.primary}" stroke-width="1.2" opacity="0.35" stroke-dasharray="4,3"/>
    <text x="${cx}" y="${chestY+32}" text-anchor="middle"
          font-size="7" fill="${pal.accent}" opacity="0.6" font-family="sans-serif">흉식호흡</text>
  ` : '';

  // ── 근육 윤곽선 (활동량 높을수록 두껍게) ──────────────
  const muscleSVG = muscleDef >= 1 ? `
    <path d="${bodyPath}" fill="none"
          stroke="${pal.primary}" stroke-width="${0.5 + muscleDef*0.4}"
          opacity="${0.15 + muscleDef*0.06}"/>
  ` : '';

  // ── 머리/얼굴 SVG ─────────────────────────────────────
  const headSVG = `
    <!-- 머리 -->
    <ellipse cx="${cx}" cy="${headY}" rx="${(isFemale?16:18)*w}" ry="20" fill="${pal.secondary}" stroke="${pal.primary}" stroke-width="1.2"/>
    ${darkCircleSVG}
    <!-- 눈 -->
    <ellipse cx="${cx-6}" cy="${headY-2}" rx="3.5" ry="${sleepBad?1.5:2.2}" fill="${pal.accent}" opacity="0.85"/>
    <ellipse cx="${cx+6}" cy="${headY-2}" rx="3.5" ry="${sleepBad?1.5:2.2}" fill="${pal.accent}" opacity="0.85"/>
    <!-- 입: 스트레스 레벨에 따라 변함 -->
    ${stressTension >= 3
      ? `<path d="M ${cx-5} ${headY+7} Q ${cx} ${headY+5} ${cx+5} ${headY+7}" fill="none" stroke="${pal.accent}" stroke-width="1.2" opacity="0.7"/>`
      : `<path d="M ${cx-5} ${headY+6} Q ${cx} ${headY+10} ${cx+5} ${headY+6}" fill="none" stroke="${pal.accent}" stroke-width="1.2" opacity="0.7"/>`
    }
    <!-- 목 -->
    <rect x="${cx-7*w}" y="${neckY-2}" width="${14*w}" height="${shouldY-neckY+4}" fill="${pal.secondary}" stroke="${pal.primary}" stroke-width="0.8" opacity="0.9"/>
  `;

  // ── 꿈 아이콘 텍스트 (발 아래) ───────────────────────
  const dreamSVG = dreamIcon ? `
    <text x="${cx}" y="${groundY+16}" text-anchor="middle" font-size="16">${dreamIcon}</text>
  ` : '';

  // ── 척추 중심선 ───────────────────────────────────────
  const spineSVG = `
    <line x1="${cx}" y1="${neckY+4}" x2="${cx+spinalLean*0.3}" y2="${hipY}"
          stroke="${pal.primary}" stroke-width="0.8" opacity="0.2" stroke-dasharray="3,4"/>
  `;

  // ── BC코드별 특수 레이어 ──────────────────────────────
  let specialSVG = '';
  if(bcCode === 'BC-06') {
    // 냉증형: 하체 순환 화살표
    specialSVG = `
      <path d="M ${cx-thighW*0.5} ${hipY+20} L ${cx-thighW*0.5} ${kneeY+10}" marker-end="url(#arrow)"
            fill="none" stroke="#2980B9" stroke-width="1" opacity="0.35" stroke-dasharray="2,2"/>
      <path d="M ${cx+thighW*0.5} ${hipY+20} L ${cx+thighW*0.5} ${kneeY+10}" marker-end="url(#arrow)"
            fill="none" stroke="#2980B9" stroke-width="1" opacity="0.35" stroke-dasharray="2,2"/>
    `;
  } else if(bcCode === 'BC-09') {
    // 코르티솔형: 복부에 파동 원
    specialSVG = `
      <circle cx="${cx}" cy="${(chestY+waistY)/2}" r="18" fill="none" stroke="${pal.primary}" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
      <circle cx="${cx}" cy="${(chestY+waistY)/2}" r="28" fill="none" stroke="${pal.primary}" stroke-width="0.7" opacity="0.15" stroke-dasharray="3,5"/>
    `;
  } else if(bcCode === 'BC-10') {
    // 요요형: 위아래 양방향 화살표 2개
    specialSVG = `
      <text x="${cx+hipW*0.9}" y="${(chestY+waistY)/2-6}" font-size="11" fill="${pal.primary}" opacity="0.5">↑</text>
      <text x="${cx+hipW*0.9}" y="${(chestY+waistY)/2+10}" font-size="11" fill="${pal.primary}" opacity="0.5">↓</text>
    `;
  } else if(bcCode === 'BC-04') {
    // 복압형: 허리 강조 띠
    specialSVG = `
      <rect x="${cx-waistW*1.1}" y="${waistY-8}" width="${waistW*2.2}" height="14"
            fill="none" stroke="${pal.primary}" stroke-width="1.2" opacity="0.35" rx="4"/>
    `;
  } else if(bcCode === 'BC-03') {
    // 상체형: 어깨 강조 수평선
    specialSVG = `
      <line x1="${cx-shoulderW*1.05}" y1="${shouldY+4}" x2="${cx+shoulderW*1.05}" y2="${shouldY+4}"
            stroke="${pal.primary}" stroke-width="2" opacity="0.3"/>
    `;
  }

  // ── 범례 생성 ─────────────────────────────────────────
  const legendItems = [];
  if(allHighlight.length) legendItems.push(`<span style="color:${pal.primary}">●</span> 집중부위`);
  if(coldZones.length)    legendItems.push(`<span style="color:#2980B9">●</span> 냉증`);
  if(numbZones.length)    legendItems.push(`<span style="color:#94A3B8">◌</span> 감각저하`);
  if(sleepBad)            legendItems.push(`<span style="color:#7F8C8D">●</span> 수면부족`);
  if(chestBreather)       legendItems.push(`<span style="color:${pal.accent}">◎</span> 흉식호흡`);
  const legendHTML = legendItems.join('&nbsp;&nbsp;');

  // ── 전체 SVG 조립 ─────────────────────────────────────
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 390" width="200" height="390"
     style="display:block;margin:0 auto;filter:drop-shadow(0 4px 16px ${pal.glow})">
  <defs>
    <radialGradient id="bodyGrad${bcCode.replace('-','')}" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="${pal.secondary}"/>
      <stop offset="100%" stop-color="#F8FBFF"/>
    </radialGradient>
    <marker id="arrow" markerWidth="4" markerHeight="4" refX="2" refY="2" orient="auto">
      <path d="M0,0 L4,2 L0,4 Z" fill="#2980B9" opacity="0.5"/>
    </marker>
    <filter id="glow${bcCode.replace('-','')}">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 배경 그라데이션 원 -->
  <circle cx="${cx}" cy="195" r="130" fill="${pal.glow}" opacity="0.5"/>

  <!-- 실루엣 기본형 -->
  <path d="${bodyPath}"
        fill="url(#bodyGrad${bcCode.replace('-','')})"
        stroke="${pal.primary}" stroke-width="1.4" opacity="0.95"/>

  <!-- 근육 윤곽 -->
  ${muscleSVG}

  <!-- 척추선 -->
  ${spineSVG}

  <!-- 부위 강조 레이어 -->
  ${highlightSVG}

  <!-- 냉증 파란 레이어 -->
  ${coldSVG}

  <!-- 감각저하 점선 레이어 -->
  ${numbSVG}

  <!-- 스트레스 긴장선 -->
  ${tensionLines}

  <!-- 호흡 타입 표시 -->
  ${breathSVG}

  <!-- BC코드 특수 레이어 -->
  ${specialSVG}

  <!-- 머리 / 얼굴 -->
  ${headSVG}

  <!-- 발끝 방향 -->
  <g transform="${footRotL}">
    <ellipse cx="${cx-calfW*0.95}" cy="${groundY}" rx="10" ry="4" fill="${pal.secondary}" stroke="${pal.primary}" stroke-width="0.8" opacity="0.85"/>
  </g>
  <g transform="${footRotR}">
    <ellipse cx="${cx+calfW*0.95}" cy="${groundY}" rx="10" ry="4" fill="${pal.secondary}" stroke="${pal.primary}" stroke-width="0.8" opacity="0.85"/>
  </g>

  <!-- 꿈 아이콘 -->
  ${dreamSVG}

  <!-- BC코드 워터마크 -->
  <text x="${cx}" y="385" text-anchor="middle"
        font-size="7.5" fill="${pal.primary}" opacity="0.35"
        font-family="system-ui,sans-serif" font-weight="700" letter-spacing="0.1em">${bcCode}</text>
</svg>`;

  return { svg, legendHTML };
}
